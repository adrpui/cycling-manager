/* --- Marché des agents libres, ouvert toute la saison --- */
function freeAgents(){return G.riders.filter(r=>r.t===-1&&!r.retired).sort((a,b)=>b.moy-a.moy);}
function proRata(sal){return Math.round(sal*Math.max(0,43-G.week)/42);}
function signFree(id){
  const r=rid(id);if(!r||r.t!==-1)return;
  const cap=G.teams[G.me].budget*0.50,ask=askSalary(r),cout=proRata(ask);
  if(teamRiders(G.me).length>=maxSquad(G.me))return notice("Effectif au complet.");
  if(masse(G.me)+ask>cap)return notice("Plafond salarial dépassé de "+U.eur(masse(G.me)+ask-cap)+".");
  if(cout>G.teams[G.me].cash)return notice("Trésorerie insuffisante : "+U.eur(cout)+" nécessaires.");
  r.t=G.me;r.sal=ask;r.ctr=1;r.free=0;r.fat=0;r.out=0;r.weekLock=false;r.racedThisWeek=false;
  if(r.p1<0||r.p2<0)autoPeaks(r);
  G.teams[G.me].cash-=cout;
  notice(U.esc(r.n)+" signe jusqu'à la fin de la saison.");
  render();saveGame();
}
/* Les équipes IA piochent aussi sur le marché, au fil des semaines */
function freeAgentsAI(){
  const libres=freeAgents();
  if(!libres.length)return;
  G.teams.forEach(t=>{
    if(t.i===G.me)return;
    const n=teamRiders(t.i).length,urgence=n<SQUAD_MIN;
    if(!urgence&&U.r()>0.05)return;
    if(n>=maxSquad(t.i))return;
    const cap=t.budget*(urgence?0.75:0.50);
    // une équipe ne se renforce que sur un coureur qui améliore vraiment son effectif,
    // sauf sous le plancher : là elle prend le meilleur coureur disponible.
    const faible=teamRiders(t.i).slice().sort((a,b)=>a.moy-b.moy)[0];
    const mini=urgence?0:(faible?faible.moy+2:60);
    const i=libres.findIndex(r=>r.moy>=mini&&masse(t.i)+askSalary(r)<=cap);
    if(i<0)return;
    const r=libres[i],sal=askSalary(r);
    libres.splice(i,1);
    r.t=t.i;r.sal=sal;r.ctr=1;r.free=0;
    if(r.p1<0||r.p2<0)autoPeaks(r);
  });
}

/* --- Sélection pré-course --- */
function renderSelect(){
  const p=G.pending.find(x=>!x.decided);
  if(p&&p.stage==="roles")return renderRolesPre(p);
  if(!p){
    const list=[];
    G.pending.forEach(x=>list.push({race:x.race,player:x.entry||null}));
    (G.otherRaces||[]).forEach(r=>list.push({race:r,player:null}));
    G.pending=[];G.otherRaces=[];
    showVeil();
    setTimeout(()=>{runWeek(list);hideVeil();},30);
    return;
  }
  const race=p.race,multi=race[5]>1;
  // indisponibles : alignés sur une course à étapes de la semaine ;
  // si la course actuelle est à étapes, alignés sur n'importe quelle autre course
  const already=new Set();
  G.pending.filter(x=>x.decided&&x.entry).forEach(x=>{
    if(multi||x.race[5]>1)x.entry.sel.forEach(r=>already.add(r.id));
  });
  const elig=r=>r.out===0&&!already.has(r.id)&&(!multi||!r.racedThisWeek);
  const pool=teamRiders(G.me);
  const eligN=pool.filter(elig).length;
  const n=Math.min(race[2]==="gt"?8:7,Math.max(4,eligN));
  const mand=race[2]==="gt"&&eligN>=4;
  const autoPick=wF=>{
    const sc=r=>baseScore(r,race[3])*Math.pow(formOf(r,race[1]),wF)*fatMult(r.fat);
    const hot=r=>inPeriod(r.p1,race[1])||inPeriod(r.p2,race[1]);
    const el=pool.filter(elig);
    const a=el.filter(hot).sort((x,y)=>sc(y)-sc(x));
    const b=el.filter(r=>!hot(r)).sort((x,y)=>sc(y)-sc(x));
    return a.concat(b).slice(0,n);
  };
  if(!G.selBuf||G.selBuf.race!==race){
    const sug=(p.sug||[]).filter(elig);
    const auto=sug.length>=Math.min(4,n)?sug.slice(0,n):autoPick(1);
    G.selBuf={race,ids:new Set(auto.map(r=>r.id)),sort:"adeq",sdir:1};
  }
  const buf=G.selBuf;
  [...buf.ids].forEach(id=>{if(!elig(rid(id)))buf.ids.delete(id)});
  const adq=r=>baseScore(r,race[3])*formOf(r,race[1])*fatMult(r.fat);
  const pkOf=r=>PC[inPeriod(r.p1,race[1])?r.p1:inPeriod(r.p2,race[1])?r.p2:nextPeak(r,race[1])];
  const sorters={
    nom:(a,b)=>a.n.localeCompare(b.n),
    adeq:(a,b)=>adq(b)-adq(a),
    forme:(a,b)=>formOf(b,race[1])-formOf(a,race[1]),
    spec:(a,b)=>a.prof.localeCompare(b.prof)||b.moy-a.moy,
    fatigue:(a,b)=>b.fat-a.fat,
    jours:(a,b)=>b.days-a.days,
    pic:(a,b)=>pkOf(a)-pkOf(b)};
  if(buf.sdir==null)buf.sdir=1;
  const rs=pool.slice().sort((a,b)=>buf.sdir*sorters[buf.sort](a,b));
  app().innerHTML=`<div class="card"><h3>Sélection : ${race[0]}</h3>
  <p class="stat">${race[5]} jour(s) · profil ${(SPNAME[race[3]]||"").toLowerCase()} · ${n} coureurs.${mand?' <b>Participation obligatoire (Grand Tour).</b>':''}</p>

function startEffort(tgt,sp,wk3,extraFat){
  const cv=$("#mgc");
  const ctx=cv&&cv.getContext?cv.getContext("2d"):null;
  if(!ctx)return false;
  stopMG();
  const fat=U.cl((tgt?tgt.fat:0)+(extraFat||0),0,100);
  let ease=1-fat/260-(sp==="m"?0.13:0)-(wk3?0.08:0);
  ease=U.cl(ease,0.45,1);
  const speed=3.0+(wk3?1.0:0);
  MG={raf:0,t:U.r()*6,speed,ease,x:0.5,last:null};
  const wp=0.045*ease,wg=0.16*ease;
  const W=cv.width,H=cv.height;
  const draw=ts=>{
    const dt=MG.last==null?0.016:Math.min(0.05,Math.max(0.001,(ts-MG.last)/1000));
    MG.last=ts;
    MG.t+=dt*MG.speed;
    MG.x=0.5+0.47*Math.sin(MG.t);
    ctx.clearRect(0,0,W,H);
    const z=(c,a,b)=>{ctx.fillStyle=c;ctx.fillRect(W*a,14,W*(b-a),36);};
    z("#5a2320",0.03,0.97);z("#7a5a1e",0.20,0.80);
    z("#2e6b3f",0.5-wg,0.5+wg);z("#ffcc33",0.5-wp,0.5+wp);
    ctx.fillStyle="#fff";ctx.fillRect(W*MG.x-2,8,4,48);
    MG.raf=RAF(draw);
  };
  MG.raf=RAF(draw);
  return true;
}
function judgeEffort(){
  const d=Math.abs(MG.x-0.5);
  const wp=0.045*MG.ease,wg=0.16*MG.ease;
  if(d<=wp)return{mult:1.05,label:"Parfait ! Forme +5 %",cls:"n90"};
  if(d<=wg)return{mult:1.025,label:"Bon effort : forme +2,5 %",cls:"ok"};
  if(d<=0.30)return{mult:1.0,label:"Dans le rythme : neutre",cls:"stat"};
  return{mult:0.97,label:"À contretemps : forme −3 %",cls:"ko"};
}

    }

/* --- Négociation type manager --- */
function uciRankOf(ti){return G.teams.slice().sort((a,b)=>b.pts-a.pts).findIndex(t=>t.i===ti)+1;}
function negoAnswer(r,off){
  G.nego=G.nego||{};
  const st=G.nego[r.id]=G.nego[r.id]||{tries:0,broken:false};
  if(st.broken)return st;
  const ask=askSalary(r);
  const rk=uciRankOf(G.me);
  // prestige : une star exige une équipe du haut de tableau, sinon prime importante
  let prem=1+(rk<=5?-0.03:rk<=8?0.02:rk<=14?0.08:0.15);
  if(r.moy>=85&&rk>8)prem+=0.12;
  if(r.moy>=82&&rk>14)prem+=0.08;
  if(st.res==null)st.res=1+U.r()*0.10+(r.moy>=85?0.05:0); // exigence cachée du coureur
  const want=ask*prem*st.res;
  // entre deux relances, un gros profil peut s'engager ailleurs
  if(st.tries>=1&&r.moy>=78&&U.r()<0.10+(r.moy-78)*0.012){
    st.broken=true;
    st.msg="« Trop tard : je viens de m'engager avec une autre équipe. »";
    return st;
  }
  const age=G.year-r.an;
  const durPref=age<=25?3:age>=33?1:2;
  const better=teamRiders(G.me).filter(x=>x.moy>r.moy).length;
  const expRole=better<3?"L":better<10?"LT":"EQ";
  const ord={L:3,LT:2,EQ:1};
  const roleFit=ord[off.role]>=ord[expRole]?0.05:-(ord[expRole]-ord[off.role])*0.10;
  const durFit=-Math.abs(off.dur-durPref)*0.035;
  const score=off.sal/want+roleFit+durFit;
  st.tries++;
  // offre insultante : rupture possible immédiate
  if(st.tries===1&&off.sal<want*0.85&&U.r()<0.5){
    st.broken=true;
    st.msg="« C'est une offre insultante. Cette discussion s'arrête là. »";
    return st;
  }
  if(score>=1.0){
    st.agreed={sal:off.sal,dur:off.dur,role:off.role};
    st.msg="« Marché conclu, on écrit une belle histoire ensemble. »";
    G.agreed=G.agreed||{};G.agreed[r.id]=st.agreed;
  } else if(st.tries>=3&&score<0.92){
    st.broken=true;
    st.msg="« On tourne en rond, je vais voir ailleurs. » Négociation rompue.";
  } else {
    const cSal=Math.round(want*(1.02+U.r()*0.05)/1000)*1000;
    const parts=[];
    if(off.sal<want*0.98)parts.push("mon agent attend "+U.eur(cSal));
    if(roleFit<0)parts.push("je vise un rôle de "+(expRole==="L"?"leader":"lieutenant"));
    if(Math.abs(off.dur-durPref)>=1)parts.push(durPref+" an(s) me conviendrait mieux");
    st.msg="« Pas à ces conditions : "+(parts.join(", ")||"faites un effort")+". »";
    st.counter={sal:cSal,dur:durPref,role:expRole};
  }
  return st;
}

    r.t=G.me;r.ctr=3;G.pool.splice(G.pool.indexOf(r),1);renderJeunes();saveGame();});
  $("#backct2").onclick=()=>{G.phase="contracts";render();};
  $("#tomkt2").onclick=()=>{G.phase="mercato";G.msub="market";render();saveGame();};
}
/* --- Mercato / bilan / renouvellements / marché --- */
function renderMercato(){
  stopMG();
  const me=G.teams[G.me];
  const cap=me.budget*0.50;
  const sub=G.mktResolved?"result":"market";
  let body="";
  if(sub==="market"){
    const pool=G.pool.filter(r=>r.t===-1&&!r.gen).sort((a,b)=>b.moy-a.moy);
    const open=G.negoOpen;
    body=specBar()+`<div class="card"><h3>Mercato (${pool.length}) · masse ${U.eur(masse(G.me))} / plafond ${U.eur(cap)}</h3>
    <p class="stat">Négociez salaire, durée et rôle promis. Un accord de principe est définitif. Les hésitants restent exposés aux enchères des autres équipes à la clôture.</p>
    ${pool.map(r=>{
      const ask=askSalary(r);
      const st=(G.nego||{})[r.id];
      const agreed=(G.agreed||{})[r.id];
      let row=`<div class="selrow one"><span class="nm lnk" data-rp="${r.id}">${U.esc(r.n)}${r.gen?" <span class='tag'>N</span>":""}</span>
      <span class="tag ${PROFTAG[r.prof]}">${PROFA[r.prof]}</span>
      <b class="${col(r.moy)}">${r.moy}</b><span class="stat">${G.year-r.an}a</span>
      <span class="stat">${U.eur(ask)}</span>
      ${agreed?`<span class="tag" style="background:#1f4d2c;color:#9fe8b5">Accord ✔ ${U.eur(agreed.sal)}·${agreed.dur}an</span><button class="btn sec sm" data-nago="${r.id}">✕</button>`
        :st&&st.broken?`<span class="tag warn">Rompu</span>`
        :`<button class="btn sec sm" data-ngo="${r.id}">${open===r.id?"Fermer":"Négocier"}</button>`}
      </div>`;
      if(open===r.id&&!agreed&&!(st&&st.broken)){
        const o=G.negoOff||{sal:ask,dur:2,role:"LT"};
        row+=`<div class="card" style="margin:4px 0 10px;background:var(--panel2)">
        <p class="stat">Demande estimée : <b>${U.eur(ask)}</b> · essai ${(st?st.tries:0)}/3</p>
        ${st&&st.msg?`<p style="font-size:.84rem;margin:4px 0">${st.msg}</p>`:""}
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px">
        <span class="pill">Salaire <b id="ngsal">${U.eur(o.sal)}</b></span>
        <button class="btn sec sm" data-nsal="-">−10%</button><button class="btn sec sm" data-nsal="+">+10%</button>
        <select id="ngdur">${[1,2,3].map(d=>`<option value="${d}" ${o.dur===d?"selected":""}>${d} an${d>1?"s":""}</option>`).join("")}</select>
        <select id="ngrole">${[["L","Leader"],["LT","Lieutenant"],["EQ","Équipier"]].map(x=>`<option value="${x[0]}" ${o.role===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select>
        <button class="btn sm" id="ngprop">Proposer</button>
        ${st&&st.counter?`<button class="btn sec sm" id="ngacc">Accepter sa demande</button>`:""}
        </div></div>`;
      }
      return row;}).join("")||'<p class="stat">Marché vide.</p>'}</div>`;
  }
  if(sub==="result"){
    const R=G.mktRes||{signed:[],lost:[]};
    body=`<div class="card"><h3>Résultat du mercato</h3>
    ${(R.forced||[]).length?`<div class="evt">Renouvellements automatiques (effectif minimum) : ${R.forced.map(x=>U.esc(x)).join(", ")}</div>`:""}
    ${R.signed.length?R.signed.map(s=>`<div class="evt">✔ <b>${U.esc(s.n)}</b> recruté · ${U.eur(s.amt)}/an</div>`).join(""):'<div class="evt stat">Aucune recrue signée.</div>'}
    ${R.lost.map(l=>`<div class="evt">✘ ${U.esc(l.n)} · ${l.by?`surenchère de <b>${U.esc(l.by)}</b> (${U.eur(l.amt)}, votre offre ${U.eur(l.mine)})`:"offre non recevable (plafond salarial ou effectif plein)"}</div>`).join("")}
    <p class="stat" style="margin-top:6px">Les équipes IA complètent leurs effectifs au lancement de la saison.</p></div>`;
  }
  const bottom=G.mktResolved
    ?`<button class="btn" id="ns2">Lancer la saison ${G.year+1} ▸</button>`
    :`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" id="backct">◂ Jeunes</button>
    <button class="btn" id="ns">Suivant : effectif ${G.year+1} ▸</button></div>`;
  app().innerHTML=body+bottom;
  document.querySelectorAll("[data-ngo]").forEach(b=>b.onclick=()=>{
    const id=+b.dataset.ngo;
    G.negoOpen=G.negoOpen===id?null:id;
    G.negoOff=null;renderMercato();});
  document.querySelectorAll("[data-nago]").forEach(b=>b.onclick=()=>{
    delete G.agreed[+b.dataset.nago];renderMercato();});
  document.querySelectorAll("[data-nsal]").forEach(b=>b.onclick=()=>{
    const r=rid(G.negoOpen);
    const o=G.negoOff||{sal:askSalary(r),dur:2,role:"LT"};
    o.sal=Math.max(100000,Math.round(o.sal*(b.dataset.nsal==="+"?1.1:0.9)/1000)*1000);
    o.dur=+($("#ngdur")?$("#ngdur").value:o.dur);o.role=$("#ngrole")?$("#ngrole").value:o.role;
    G.negoOff=o;renderMercato();});
  const prop=$("#ngprop");if(prop)prop.onclick=()=>{
    const r=rid(G.negoOpen);
    const o=G.negoOff||{sal:askSalary(r),dur:2,role:"LT"};
    o.dur=+$("#ngdur").value;o.role=$("#ngrole").value;
    if(teamRiders(G.me).length+Object.keys(G.agreed||{}).length>=maxSquad(G.me)){notice("Effectif maximum atteint.");return;}
    if(masse(G.me)+o.sal>cap){notice("Plafond salarial dépassé.");return;}
    negoAnswer(r,o);G.negoOff=o;renderMercato();saveGame();};
  const acc=$("#ngacc");if(acc)acc.onclick=()=>{
    const r=rid(G.negoOpen);
    const c=G.nego[r.id].counter;
    if(masse(G.me)+c.sal>cap){notice("Plafond salarial dépassé.");return;}
    G.negoOff={...c};negoAnswer(r,{...c});renderMercato();saveGame();};
  const bc=$("#backct");if(bc)bc.onclick=()=>{G.phase="jeunes";render();};
  const ns=$("#ns");if(ns)ns.onclick=()=>{
    G.phase="preval";render();saveGame();};
  const ns2=$("#ns2");if(ns2)ns2.onclick=()=>{
    showVeil("Intersaison…");
    setTimeout(()=>{
      newSeason();
      hideVeil();saveGame();
    },30);
  };
}

/* --- Écran Effectif N+1 : validation d'intersaison --- */
function renderPreval(){
  stopMG();
  const cap=G.teams[G.me].budget*0.50;
  const squad=teamRiders(G.me).slice().sort((a,b)=>b.moy-a.moy);
  const agreed=Object.entries(G.agreed||{}).map(([id,a])=>({r:rid(+id),a})).filter(x=>x.r&&x.r.t===-1);
  const masseProj=masse(G.me)+agreed.reduce((s,x)=>s+x.a.sal,0);
  const nProj=squad.length+agreed.length;
  const over=masseProj-cap;
  const okAll=over<=0&&nProj>=8&&nProj<=maxSquad(G.me);
  app().innerHTML=`<div class="card" style="position:sticky;top:46px;z-index:5;padding:8px 12px">
  <h3>Effectif ${G.year+1}</h3>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px">
  <span class="pill">Coureurs <b class="${nProj<8||nProj>maxSquad(G.me)?"ko":""}">${nProj}</b>/${maxSquad(G.me)}</span>
  <span class="pill">Masse <b class="${over>0?"ko":"ok"}">${U.eur(masseProj)}</b> / ${U.eur(cap)}</span>
  ${over>0?`<span class="stat" style="color:var(--warn)">${U.eur(over)} au-dessus du plafond</span>`:""}
  </div></div>
  ${agreed.length?`<div class="card"><h3>Accords mercato (${agreed.length})</h3>
  ${agreed.map(x=>`<div class="selrow one"><span class="nm lnk" data-rp="${x.r.id}">${U.esc(x.r.n)}</span>
  <span class="tag ${PROFTAG[x.r.prof]}">${PROFA[x.r.prof]}</span><b class="${col(x.r.moy)}">${x.r.moy}</b>
  <span class="stat">${U.eur(x.a.sal)}·${x.a.dur}an</span>
  <button class="btn sec sm" data-pvx="${x.r.id}" style="color:var(--warn)">Annuler</button></div>`).join("")}</div>`:""}
  <div class="card"><h3>Sous contrat (${squad.length})</h3>
  ${squad.map(r=>`<div class="selrow one"><span class="nm lnk" data-rp="${r.id}">${U.esc(r.n)}${r.gen&&r.ctr===3?' <span class="tag">N</span>':""}</span>
  <span class="tag ${PROFTAG[r.prof]}">${PROFA[r.prof]}</span><b class="${col(r.moy)}">${r.moy}</b>
  <span class="stat">${U.eur(r.sal||salary(r))}</span>
  <button class="btn sec sm" data-pvr="${r.id}" style="color:var(--warn)">Libérer</button></div>`).join("")}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
  <button class="btn sec" id="pvback">◂ Mercato</button>
  <button class="btn" id="pvok">Valider et clôturer ▸</button></div>`;
  document.querySelectorAll("[data-pvx]").forEach(b=>b.onclick=()=>{
    delete G.agreed[+b.dataset.pvx];renderPreval();saveGame();});
  document.querySelectorAll("[data-pvr]").forEach(b=>b.onclick=()=>{
    const r=rid(+b.dataset.pvr);
    r.t=-1;r.ctr=0;r.role=undefined;if(!G.pool.includes(r))G.pool.push(r);
    G.renew=(G.renew||[]).filter(id=>id!==r.id);
    renderPreval();saveGame();});
  $("#pvback").onclick=()=>{G.phase="mercato";G.msub="market";render();};
  $("#pvok").onclick=()=>{
    if(!okAll){
      notice(over>0?"Masse au-dessus du plafond : libérez ou annulez ("+U.eur(over)+").":nProj<8?"Effectif minimum : 8 coureurs.":"Effectif maximum dépassé.");
      return;
    }
    resolveMarket();G.phase="mercato";render();saveGame();
  };
}
/* ================= TESTS (harnais) ================= */
window.TestAPI={
  get G(){return G},init,advance:advanceSync,formOf,baseScore,simOneDay,simStageRace,rid,reindex,
  invitedTeams,aiSelect,aiTactic,salary,masse,endSeason,newSeason,racesStarting,stageProfiles,
  initStageRace,simStage,finishStageRace,gcOf,jerseysOf,
  askSalary,resolveMarket,restockTeams,teamPeaks,standingsRows,
  aiPlanWeek,buildRoles,negoAnswer,saveGame,loadGame,hasSave,wipeSave,autoRoles,buildCtxRoles,rolesValid,
  autoSeason(){ // joue la saison entière, sélections auto pour le joueur
    let guard=0;
    while(G.week<=42&&guard++<400){
      const todo=racesStarting(G.week);
      const list=todo.map(race=>{
        if(!invitedTeams(race).includes(G.me))return {race,player:null};
        const n=race[2]==="gt"?8:7;
        const sel=aiSelect(G.me,race,n);
        if(sel.length<n)return {race,player:null};
        const t=autoRoles(sel,race);
        return {race,player:{sel,leader:t.leader,roles:t.roles}};
      });
      runWeekSync(list);
    }
  }
};
function runWeekSync(list){const t=G.tab;runWeek(list);G.tab=t;}
function advanceSync(){const todo=racesStarting(G.week);runWeekSync(todo.map(r=>({race:r,player:null})));}

/* ================= DÉMARRAGE ================= */
render();
</script>
