<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cycling Manager 2026</title>
<style>
:root{
  --bg:#0e1420;--panel:#161e2e;--panel2:#1c2638;--line:#2a3650;
  --txt:#e8edf5;--dim:#8fa0b8;--acc:#ffcc33;--ok:#4cd97b;--warn:#ff6b5e;--info:#4da3ff;
  --wt:#4da3ff;--pt:#c78bff;
  font-size:15px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:30px}
button{font-family:inherit}
.wrap{max-width:1050px;margin:0 auto;padding:10px}
/* Top bar */
#top{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#101828,#0e1420ee);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#top .jersey{width:18px;height:18px}
#top b{color:var(--acc)}
#top .it{font-size:.8rem;color:var(--dim)}
#top .it b{font-size:.9rem}
.jersey{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px;border:1px solid rgba(255,255,255,.25)}
/* Tabs */
.tabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tabs button{background:var(--panel);border:1px solid var(--line);color:var(--dim);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:.88rem}
.tabs button.on{background:var(--acc);color:#1a1a1a;border-color:var(--acc);font-weight:600}
.btn{background:var(--acc);color:#1a1a1a;border:none;padding:10px 20px;border-radius:9px;font-weight:700;cursor:pointer;font-size:.95rem}
.btn:disabled{opacity:.4;cursor:default}
.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line);font-weight:500}
.btn.warn{background:var(--warn);color:#fff}
/* Tables / cards */
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{color:var(--dim);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;user-select:none}
td{padding:6px 8px;border-bottom:1px solid var(--panel2);white-space:nowrap}
tr:hover td{background:var(--panel)}
tr.me td{background:#1e2a1e}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{font-size:1rem;color:var(--acc);margin-bottom:8px}
.stat{color:var(--dim);font-size:.78rem}
.n90{color:var(--acc);font-weight:700}.n80{color:var(--ok)}.n70{color:var(--txt)}.nlo{color:var(--dim)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}:root{font-size:13.5px}}
/* Fatigue / forme bars */
.bar{display:inline-block;width:52px;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;vertical-align:middle}
.bar i{display:block;height:100%}
/* Selection */
.selrow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-bottom:1px solid var(--panel2);font-size:.84rem;flex-wrap:wrap}
.selrow.on{background:#20301f}
.selrow input[type=checkbox]{width:17px;height:17px;accent-color:var(--acc)}
.selrow input[type=radio]{accent-color:var(--warn)}
.selrow .nm{min-width:150px;font-weight:600}
select{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:5px 8px;border-radius:7px;font-size:.82rem}
.tag{font-size:.68rem;padding:1px 7px;border-radius:10px;font-weight:600;background:var(--panel2);color:var(--dim)}
.tag.mon{background:#3d2b52;color:#d9b8ff}.tag.spr{background:#14324a;color:#8fd0ff}.tag.gc{background:#4a3812;color:#ffd97a}
.tag.warn{background:#4a1f1c;color:#ffb0a8}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:.72rem;background:var(--panel2);color:var(--dim);margin-right:6px}
/* Overlays */
#veil{position:fixed;inset:0;background:#0a0f18e6;display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column;gap:14px}
#veil.on{display:flex}
.spin{width:38px;height:38px;border:4px solid var(--panel2);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* Accueil */
.home{max-width:760px;margin:40px auto;text-align:center;padding:14px}
.home h1{font-size:1.8rem;color:var(--acc);margin-bottom:6px}
.home p{color:var(--dim);margin-bottom:18px}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;text-align:left}
.tpick{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-size:.85rem}
.tpick:hover{border-color:var(--acc)}
.tpick .stat{display:block;margin-top:3px}
.hl{color:var(--acc);font-weight:700}
.ok{color:var(--ok)}.ko{color:var(--warn)}
h2.sec{font-size:1.1rem;color:var(--acc);margin:14px 0 8px}
.evt{font-size:.82rem;color:var(--dim);padding:3px 0}
.evt b{color:var(--txt)}
</style>
</head>

/* ================= UTILITAIRES ================= */
const U={
  r:Math.random,
  g(){let s=0;for(let i=0;i<4;i++)s+=U.r();return (s-2)/1.16}, // ~N(0,1) borné
  cl(v,a,b){return v<a?a:v>b?b:v},
  pick(a){return a[Math.floor(U.r()*a.length)]},
  eur(n){return (n>=1e6?(n/1e6).toFixed(2)+" M€":Math.round(n/1000)+" k€")},
  esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))},
  tm(sec){ // format écart chrono
    if(sec<1)return "—";
    const m=Math.floor(sec/60),s=Math.round(sec%60);
    return "+"+(m?m+"'":"")+String(s).padStart(m?2:1,"0")+'"';
  }
};

/* Poids d'attributs par profil d'étape/course */
const WGT={
  p:{pla:.40,spr:.40,pun:.10,chr:.10,mon:0},
  c:{pla:.50,pun:.25,spr:.15,chr:.10,mon:0},
  v:{pun:.45,mon:.28,pla:.15,spr:.12,chr:0},
  m:{mon:.62,chr:.12,pun:.14,pla:.12,spr:0},
  t:{chr:.72,pla:.22,pun:.06,mon:0,spr:0}
};
/* Écarts de temps par point de score selon profil d'étape */
const GAPK={p:1.1,c:4.5,v:4.0,m:9.5,t:6.0};

/* Barèmes points UCI (top 15) par tier ; GT: barème GC + bonus étape */
const PTS={
  2:[300,220,165,125,95,75,60,50,40,35,30,25,20,15,10],
  3:[500,375,300,240,190,155,125,105,85,70,60,50,40,30,20],
  4:[800,640,520,420,340,270,225,185,150,125,105,85,70,60,50],
  5:[1300,1000,850,700,575,460,380,320,260,220,185,155,130,110,95]
};

/* Primes (€) au vainqueur par tier, dégressives */
const PRIZE={2:22000,3:45000,4:90000,5:550000,stage:12000};

/* ================= ÉTAT ================= */
let G=null;

function newRider(base,ti){
  const [n,nat,an,pla,mon,spr,chr,pun,end]=base;
  const r={n,nat,an,pla,mon,spr,chr,pun,end,t:ti,
    moy:Math.round((pla+mon+spr+chr+pun+end)/6),
    fat:0,pts:0,wins:0,races:0,out:0,p1:12,p2:27,gen:false};
  const a=[["mon",mon],["spr",spr],["pun",pun],["chr",chr],["pla",pla]].sort((x,y)=>y[1]-x[1]);
  r.prof=a[0][0];
  return r;
}
/* Pics par défaut selon profil (IA + suggestion joueur) */
function autoPeaks(r){
  if(r.prof==="mon"){const g=[[19,27],[27,34],[19,34]];[r.p1,r.p2]=U.pick(g);}
  else if(r.prof==="spr"){[r.p1,r.p2]=U.pick([[12,27],[7,27],[12,34]]);}
  else if(r.prof==="pun"){[r.p1,r.p2]=U.pick([[16,37],[17,31],[16,41]]);}
  else {[r.p1,r.p2]=U.pick([[13,27],[14,34],[11,27]]);}
}

function init(teamIdx){
  G={me:teamIdx,year:2026,week:1,phase:"peaks",tab:"home",
    riders:[],teams:TEAMS.map((t,i)=>({i,pts:0,cash:t[4]*1e6*0.25,budget:t[4]*1e6,wins:0})),
    log:[],season:1,history:[],pending:[],selBuf:null,lastRes:[]};
  ROSTERS.forEach((ros,ti)=>ros.forEach(b=>{
    const r=newRider(b,ti);autoPeaks(r);G.riders.push(r);
  }));
  G.riders.forEach((r,i)=>r.id=i);
}
const teamRiders=ti=>G.riders.filter(r=>r.t===ti&&!r.retired);
const salary=r=>Math.max(100000,Math.pow(Math.max(0,r.moy-50),2)*2200);
const masse=ti=>teamRiders(ti).reduce((s,r)=>s+salary(r),0);

/* ================= FORME / FATIGUE ================= */
function formOf(r,w){
  const b=Math.max(Math.exp(-((w-r.p1)**2)/18),Math.exp(-((w-r.p2)**2)/18));
  return 0.94+0.14*b; // 0.94 → 1.08
}
const fatMult=f=>1-Math.max(0,f-30)*0.004;
function recoverWeek(){
  G.riders.forEach(r=>{
    if(!r.racedThisWeek)r.fat=U.cl(r.fat-(r.end/10+4),0,100);
    r.racedThisWeek=false;
    if(r.out>0)r.out--;
  });
}
const raceFatCost=(race)=>race[5]*2.6;

/* ================= SIMULATION ================= */
function baseScore(r,prof){
  const w=WGT[prof];
  return r.pla*w.pla+r.mon*w.mon+r.spr*w.spr+r.chr*w.chr+r.pun*w.pun;
}
/* Sélection IA d'une équipe pour une course */
function aiSelect(ti,race,n){
  const prof=race[3];
  const pool=teamRiders(ti).filter(r=>r.out===0&&!r.racedThisWeek&&r.fat<78);
  const scored=pool.map(r=>({r,s:baseScore(r,prof)*formOf(r,race[1])*fatMult(r.fat)}))
    .sort((a,b)=>b.s-a.s);
  return scored.slice(0,n).map(x=>x.r);
}
/* Tactique IA simple */
function aiTactic(sel,race){
  const prof=race[3];
  const lead=sel.slice().sort((a,b)=>baseScore(b,prof)-baseScore(a,prof))[0];
  return {leader:lead,mode:prof==="p"?"sprint":(race[2]!=="cl"?"gc":"leader")};
}
/* Score en course d'un coureur */
function riderScore(r,prof,week,ctx){
  let s=baseScore(r,prof)*formOf(r,week)*fatMult(r.fat+(ctx.extraFat||0));
  if(ctx.leaderOf&&ctx.leaderOf.get(r)===r){}
  const lead=ctx.leaders.get(r.t);
  if(lead===r){
    // soutien des équipiers : moyenne de leur adéquation
    const help=ctx.helpers.get(r.t)||0;
    s*=1+0.085*help;
    if(ctx.tactics.get(r.t)==="sprint"&&prof==="p")s*=1.03;
    if(ctx.tactics.get(r.t)==="echappee")s*=0.97;
  } else {
    s*=0.955; // équipier au service
    if(ctx.tactics.get(r.t)==="echappee")s*=1+ (U.r()<0.12?0.09:0);
  }
  return s*(1+U.g()*0.072);
}
function buildCtx(entries,race){
  const leaders=new Map(),tactics=new Map(),helpers=new Map();
  entries.forEach(e=>{
    leaders.set(e.ti,e.leader);
    tactics.set(e.ti,e.mode);
    const hs=e.sel.filter(r=>r!==e.leader);
    const prof=race[3];
    const h=hs.length?hs.reduce((s,r)=>s+baseScore(r,prof),0)/hs.length/100:0;
    helpers.set(e.ti,h);
  });
  return {leaders,tactics,helpers};
}
/* Course d'un jour */
function simOneDay(race,entries){
  const ctx=buildCtx(entries,race);
  const all=[];
  entries.forEach(e=>e.sel.forEach(r=>all.push(r)));
  const prof=race[3];
  const rk=all.map(r=>({r,s:riderScore(r,prof,race[1],{...ctx,extraFat:0})}))
    .sort((a,b)=>b.s-a.s);
  return {rank:rk.map(x=>x.r),stages:null,events:[]};
}
/* Profils d'étapes d'une course à étapes */
function stageProfiles(race){
  const d=race[5],prof=race[3],out=[];
  if(race[2]==="gt"){
    const mix=["p","p","p","p","p","p","p","v","v","v","v","v","m","m","m","m","m","m","m","t","t"];
    for(let i=0;i<21;i++)out.push(mix[i]);
    // mélange léger déterministe-aléatoire
    for(let i=out.length-1;i>0;i--){const j=Math.floor(U.r()*(i+1));[out[i],out[j]]=[out[j],out[i]];}
    out[20]=prof==="m"?"m":"p"; // final décisif
    return out;
  }
  const base=prof==="m"?["p","v","m","t","m","m","v","m"]:prof==="v"?["p","v","v","t","p","v","m","v"]:prof==="c"?["p","c","p","c","c"]:["p","p","v","t","p","p","v"];
  for(let i=0;i<d;i++)out.push(base[i%base.length]);
  return out;
}
/* Course à étapes / grand tour */
function simStageRace(race,entries){
  const ctx=buildCtx(entries,race);
  const profs=stageProfiles(race);
  const state=new Map(); // r -> {time, fat, out}
  const all=[];
  entries.forEach(e=>e.sel.forEach(r=>{all.push(r);state.set(r,{time:0,f:0,ab:false});}));
  const stageWins=[],events=[];
  const dailyFat=r=>2.6*(115-r.end)/45;
  profs.forEach((sp,si)=>{
    const live=all.filter(r=>!state.get(r).ab);
    const rk=live.map(r=>{
      const st=state.get(r);
      return {r,s:riderScore(r,sp,race[1],{...ctx,extraFat:st.f})};
    }).sort((a,b)=>b.s-a.s);
    const top=rk[0].s;
    rk.forEach((x,i)=>{
      const st=state.get(x.r);
      let gap=(top-x.s)*GAPK[sp];
      if(sp==="p"&&i<Math.min(40,rk.length*0.6))gap=0; // arrivée groupée
      st.time+=gap;
      st.f+=dailyFat(x.r);
      // abandon
      const risk=0.0015+Math.max(0,(x.r.fat+st.f-75))*0.0035;
      if(U.r()<risk&&si<profs.length-1){st.ab=true;
        events.push("Ét. "+(si+1)+" : abandon de <b>"+U.esc(x.r.n)+"</b> ("+TEAMS[x.r.t][0]+")");}
    });
    const w=rk[0].r;
    stageWins.push({st:si+1,prof:sp,r:w});
  });
  const fin=all.filter(r=>!state.get(r).ab)
    .sort((a,b)=>state.get(a).time-state.get(b).time);
  return {rank:fin,stages:stageWins,events,times:state};
}
/* Invitations à une course */
function invitedTeams(race){
  const out=[];
  if(race[2]==="gt"){
    const mask=race[0].includes("Giro")?1:race[0].includes("France")?2:4;
    TEAMS.forEach((t,i)=>{if(t[3]&mask)out.push(i)});
    return out;
  }
  TEAMS.forEach((t,i)=>{if(t[2]===0)out.push(i)});
  [18,19,20].forEach(i=>out.push(i)); // Tudor, Q36.5, Cofidis
  // 2-3 wildcards régionales pseudo-aléatoires stables par course
  const seed=race[0].length+race[1];
  const pts=[21,22,23,24,25,26,27];
  for(let k=0;k<3;k++)out.push(pts[(seed*7+k*3)%pts.length]);
  return [...new Set(out)];
}
/* Application des résultats : points, primes, fatigue, stats */
function applyResults(race,res){
  const tier=race[4],scale=PTS[tier];
  const gains=new Map();
  res.rank.slice(0,15).forEach((r,i)=>{
    r.pts+=scale[i];
    if(i===0){r.wins++;G.teams[r.t].wins++;}
    const p=PRIZE[tier]*Math.pow(0.62,i);
    gains.set(r.t,(gains.get(r.t)||0)+p);
  });
  if(res.stages)res.stages.forEach(sw=>{
    sw.r.pts+=STAGE_PTS[0]/ (race[4]===5?1:2.4);
    gains.set(sw.r.t,(gains.get(sw.r.t)||0)+PRIZE.stage);
  });
  gains.forEach((v,ti)=>G.teams[ti].cash+=v);
  // fatigue + stats participants
  res.entries.forEach(e=>e.sel.forEach(r=>{
    const ab=res.times&&res.times.get(r)&&res.times.get(r).ab;
    r.fat=U.cl(r.fat+raceFatCost(race)*(ab?0.55:1)*(115-r.end)/58,0,100);
    r.races++;r.racedThisWeek=true;
    if(ab){r.out=1;}
  }));
  G.teams.forEach(t=>t.pts=teamRiders(t.i).reduce((s,r)=>s+r.pts,0));
}

/* ================= BOUCLE SAISON ================= */
function racesOfWeek(w){return RACES.filter(r=>r[1]===w||(r[2]!=="cl"&&w>r[1]&&w<r[1]+Math.ceil(r[5]/7)));}
function racesStarting(w){return RACES.filter(r=>r[1]===w);}

async function advance(){
  if(G.pending.length)return; // sélection en cours
  const veil=document.getElementById("veil");
  veil.classList.add("on");
  await new Promise(rs=>setTimeout(rs,30));
  const todo=racesStarting(G.week);
  const mine=todo.filter(r=>invitedTeams(r).includes(G.me));
  if(mine.length){
    G.pending=mine.map(r=>({race:r,decided:false}));
    G.otherRaces=todo.filter(r=>!mine.includes(r));
    veil.classList.remove("on");
    G.tab="select";render();
    return;
  }
  runWeek(todo.map(r=>({race:r,player:null})));
  veil.classList.remove("on");
}
/* Exécute toutes les courses de la semaine (player = {sel,leader,mode} ou null) */
function runWeek(list){
  G.lastRes=[];
  list.forEach(({race,player})=>{
    const inv=invitedTeams(race);
    const n=race[2]==="gt"?8:7;
    const entries=[];
    inv.forEach(ti=>{
      if(ti===G.me){
        if(!player)return; // impasse
        entries.push({ti,sel:player.sel,leader:player.leader,mode:player.mode});
      } else {
        const sel=aiSelect(ti,race,n);
        if(sel.length<Math.min(5,n))return;
        const t=aiTactic(sel,race);
        entries.push({ti,sel,leader:t.leader,mode:t.mode});
      }
    });
    const res=race[5]>1?simStageRace(race,entries):simOneDay(race,entries);
    res.entries=entries;res.race=race;
    applyResults(race,res);
    G.lastRes.push(res);
    G.log.unshift({w:G.week,race,res});
  });
  // fin de semaine
  recoverWeek();
  // économie mensuelle (toutes les 4 semaines)
  if(G.week%4===0){
    G.teams.forEach(t=>{t.cash+=t.budget/13;t.cash-=masse(t.i)/13+t.budget*0.026;});
  }
  G.week++;
  if(G.week>42){endSeason();return;}
  G.tab=G.lastRes.length?"results":"home";
  render();
}

/* ================= FIN DE SAISON / MERCATO ================= */
function endSeason(){
  const rankT=G.teams.slice().sort((a,b)=>b.pts-a.pts);
  const meRank=rankT.findIndex(t=>t.i===G.me)+1;
  const meBest=teamRiders(G.me).sort((a,b)=>b.pts-a.pts)[0];
  G.history.push({year:G.year,rank:meRank,pts:G.teams[G.me].pts,wins:G.teams[G.me].wins,best:meBest?meBest.n:"—"});
  // écrêtage trésorerie : surplus réinvesti par le sponsor, déficit partiellement épongé
  G.teams.forEach(t=>{t.cash=U.cl(t.cash,-8e6,t.budget*0.6);});
  // budget suivant selon classement
  G.teams.forEach(t=>{
    const rk=rankT.findIndex(x=>x.i===t.i);
    const f=1.14-rk*0.011;
    t.budget=U.cl(t.budget*f,4e6,72e6);
  });
  // progression / vieillissement
  G.riders.forEach(r=>{
    const age=G.year-r.an;
    const ks=["pla","mon","spr","chr","pun","end"];
    if(age<=23)ks.forEach(k=>{if(U.r()<0.5)r[k]=U.cl(r[k]+1+(U.r()<0.25?1:0),30,99)});
    else if(age>=33)ks.forEach(k=>{if(U.r()<0.55)r[k]=U.cl(r[k]-(1+(U.r()<0.3?1:0)),30,99)});
    r.moy=Math.round((r.pla+r.mon+r.spr+r.chr+r.pun+r.end)/6);
    if(age>=38||(age>=36&&U.r()<0.35))r.retired=true;
  });
  // mercato : pool = libérés IA + néo-pros
  G.pool=[];
  G.teams.forEach(t=>{
    if(t.i===G.me)return;
    const rs=teamRiders(t.i).sort((a,b)=>a.moy-b.moy);
    const nRel=U.r()<0.5?1:2;
    rs.slice(0,nRel).forEach(r=>{if(r.moy<74){r.t=-1;G.pool.push(r);}});
  });
  for(let i=0;i<14;i++)G.pool.push(genNeo());
  G.phase="mercato";G.released=0;G.signed=0;
  G.tab="mercato";render();
}
const NEO={
  FRA:[["Léo","Mathis","Nolan","Tom","Enzo","Baptiste","Maël","Louis"],["Bernard","Roux","Fontaine","Garnier","Lemoine","Perrot","Chevalier","Marchand"]],
  BEL:[["Arne","Wout","Senne","Milan","Jarne","Lars"],["Vermeulen","Claes","Peeters","Maes","Willems","Segers"]],
  ITA:[["Matteo","Luca","Davide","Simone","Tommaso","Pietro"],["Rinaldi","Ferretti","Marini","Colombo","Villa","Gatti"]],
  ESP:[["Iker","Pau","Hugo","Marc","Unai","Adrián"],["Navarro","Molina","Ortega","Vidal","Serrano","Campos"]],
  NED:[["Daan","Sven","Thijs","Luuk","Niels"],["Bakker","Visser","Smit","Mulder","Kok"]],
  GBR:[["Oliver","Harry","Callum","Finn","Jack"],["Walker","Hughes","Bell","Shaw","Dean"]],
  DEN:[["Emil","Oscar","Magnus","Anton"],["Nielsen","Holm","Dahl","Skov"]],
  COL:[["Santiago","Juan","Camilo","Andrés"],["Rojas","Cárdenas","Mora","Quintero"]]
};
function genNeo(){
  const nat=U.pick(Object.keys(NEO));
  const [f,l]=NEO[nat];
  const n=U.pick(f)[0]+". "+U.pick(l);
  const prof=U.pick(["mon","spr","pun","pla","chr"]);
  const b=k=>U.cl(Math.round(56+U.g()*7+(k===prof?14:0)),40,84);
  const base=[n,nat,G.year-19-Math.floor(U.r()*3),b("pla"),b("mon"),b("spr"),b("chr"),b("pun"),U.cl(Math.round(66+U.g()*6),50,84)];
  const r=newRider(base,-1);r.gen=true;autoPeaks(r);r.id=G.riders.length;G.riders.push(r);
  return r;
}
function aiMercato(){
  // IA recomplète ses effectifs
  const pool=G.pool.filter(r=>r.t===-1);
  G.teams.forEach(t=>{
    if(t.i===G.me)return;
    const target=TEAMS[t.i][2]===0?16:10;
    let need=target-teamRiders(t.i).length;
    while(need>0&&pool.length){
      const cand=pool.sort((a,b)=>b.moy-a.moy)[0];
      cand.t=t.i;pool.splice(pool.indexOf(cand),1);need--;
    }
  });
  // néo-pros restants complètent le mien si sous-effectif après refus joueur? non: restent libres, supprimés
  G.pool=[];
}
function newSeason(){
  aiMercato();
  G.year++;G.week=1;G.season++;
  G.riders.forEach(r=>{r.pts=0;r.wins=0;r.races=0;r.fat=0;r.out=0;autoPeaks(r);});
  G.riders=G.riders.filter(r=>!r.retired&&r.t>=0);
  G.riders.forEach((r,i)=>r.id=i);
  G.teams.forEach(t=>{t.pts=0;t.wins=0;t.cash=Math.max(t.cash,t.budget*0.12);});
  G.log=[];G.phase="peaks";G.tab="home";
  render();
}

    return `<tr ${cur?'class="me"':''}><td class="stat">S${r[1]}</td><td>${r[4]>=4?"<b>"+r[0]+"</b>":r[0]}</td>
    <td>${TY[r[2]]}</td><td>${PR[r[3]]}</td><td>${r[5]}</td>
    <td>${w?jer(w.t)+U.esc(w.n):'<span class="stat">—</span>'}</td></tr>`}).join("")}
  </tbody></table></div></div>`;
}

/* --- Classements --- */
function vRank(){
  const ri=G.riders.filter(r=>r.t>=0&&r.pts>0).sort((a,b)=>b.pts-a.pts).slice(0,50);
  const ts=G.teams.slice().sort((a,b)=>b.pts-a.pts);
  return `<div class="grid2">
  <div class="card"><h3>UCI individuel</h3><div class="scroll"><table><thead><tr><th>#</th><th>Coureur</th><th>Équipe</th><th>Pts</th></tr></thead><tbody>
  ${ri.map((r,i)=>`<tr ${r.t===G.me?'class="me"':''}><td class="stat">${i+1}</td><td>${U.esc(r.n)}</td><td>${jer(r.t)}<span class="stat">${TEAMS[r.t][0]}</span></td><td class="n80">${Math.round(r.pts)}</td></tr>`).join("")}
  </tbody></table></div></div>
  <div class="card"><h3>UCI équipes</h3><div class="scroll"><table><thead><tr><th>#</th><th>Équipe</th><th>Pts</th><th>Vict.</th></tr></thead><tbody>
  ${ts.map((t,i)=>`<tr ${t.i===G.me?'class="me"':''}><td class="stat">${i+1}</td><td>${jer(t.i)}${TEAMS[t.i][0]}</td><td class="n80">${Math.round(t.pts)}</td><td>${t.wins}</td></tr>`).join("")}
  </tbody></table></div></div></div>`;
}

/* --- Finances --- */
function vFin(){
  const me=G.teams[G.me];
  return `<div class="card"><h3>Finances</h3>
  <div class="evt">Budget sponsor annuel : <b>${U.eur(me.budget)}</b></div>
  <div class="evt">Masse salariale annuelle : <b>${U.eur(masse(G.me))}</b></div>
  <div class="evt">Frais de structure : <b>${U.eur(me.budget*0.026*10)}</b>/an env.</div>
  <div class="evt">Trésorerie : <b class="${me.cash<0?"ko":"ok"}">${U.eur(me.cash)}</b></div>
  <p class="stat" style="margin-top:8px">Le budget de la saison suivante dépendra du classement UCI par équipes. Les primes de courses créditent la trésorerie immédiatement.</p></div>
  ${G.history.length?`<div class="card"><h3>Historique</h3>${G.history.map(h=>`<div class="evt">${h.year} : <b>${h.rank}ᵉ</b> UCI · ${Math.round(h.pts)} pts · ${h.wins} victoires · leader ${U.esc(h.best)}</div>`).join("")}</div>`:""}`;
}

/* --- Sélection pré-course --- */
function renderSelect(){
  const p=G.pending.find(x=>!x.decided);
  if(!p){ // toutes décidées : lancer la semaine
    const list=[];
    G.pending.forEach(x=>list.push({race:x.race,player:x.entry||null}));
    (G.otherRaces||[]).forEach(r=>list.push({race:r,player:null}));
    G.pending=[];G.otherRaces=[];
    document.getElementById("veil").classList.add("on");
    setTimeout(()=>{runWeek(list);document.getElementById("veil").classList.remove("on");},30);
    return;
  }
  const race=p.race,n=race[2]==="gt"?8:7;
  if(!G.selBuf||G.selBuf.race!==race){
    // présélection auto proposée
    const auto=aiSelect(G.me,race,n);
    G.selBuf={race,ids:new Set(auto.map(r=>r.id)),leader:auto.length?aiTactic(auto,race).leader.id:null,mode:race[3]==="p"?"sprint":"leader"};
  }
  const buf=G.selBuf;
  const rs=teamRiders(G.me).slice().sort((a,b)=>baseScore(b,race[3])-baseScore(a,race[3]));
  const cnt=buf.ids.size;
  const mand=race[2]==="gt";
  const already=new Set();G.pending.filter(x=>x.decided&&x.entry).forEach(x=>x.entry.sel.forEach(r=>already.add(r.id)));
  app().innerHTML=`<div class="card"><h3>Sélection : ${race[0]}</h3>
  <p class="stat">${race[5]} jour(s) · profil ${{p:"plat",c:"pavés",v:"vallonné",m:"montagne"}[race[3]]} · ${n} coureurs requis · adéquation triée pour cette course.${mand?' <b>Participation obligatoire (Grand Tour).</b>':''}</p>
  <div style="margin:8px 0">Tactique :
  <select id="mode">
    <option value="leader" ${buf.mode==="leader"?"selected":""}>Tout pour le leader</option>
    <option value="sprint" ${buf.mode==="sprint"?"selected":""}>Train de sprint</option>
    <option value="echappee" ${buf.mode==="echappee"?"selected":""}>Jouer les échappées</option>
  </select>
  <span class="pill">Sélection : <b id="cnt">${cnt}</b>/${n}</span></div>
  ${rs.map(r=>{
    const dis=r.out>0||r.racedThisWeek||already.has(r.id);
    const on=buf.ids.has(r.id);
    const ad=Math.round(baseScore(r,race[3])*formOf(r,race[1])*fatMult(r.fat));
    return `<div class="selrow ${on?"on":""}">
    <input type="checkbox" data-c="${r.id}" ${on?"checked":""} ${dis?"disabled":""}>
    <input type="radio" name="ld" data-l="${r.id}" ${buf.leader===r.id?"checked":""} ${dis?"disabled":""} title="Leader">
    <span class="nm">${U.esc(r.n)}</span>
    <span class="tag ${PROFTAG[r.prof]}">${PROFN[r.prof]}</span>
    <span class="stat">Adéq. <b class="${col(ad)}">${ad}</b></span>
    <span class="stat">Forme ${formPct(r,race[1])}</span>
    ${fatBar(r.fat)}
    ${r.fat>65?'<span class="tag warn">fatigue</span>':''}
    ${dis&&already.has(r.id)?'<span class="tag warn">déjà aligné</span>':''}
    </div>`}).join("")}
  <div style="margin-top:12px;display:flex;gap:8px">
  <button class="btn" id="go">Valider la sélection</button>
  ${mand?"":'<button class="btn sec" id="skip">Faire l\'impasse</button>'}
  </div></div>`;
  $("#mode").onchange=e=>buf.mode=e.target.value;
  document.querySelectorAll("input[data-c]").forEach(c=>c.onchange=()=>{
    const id=+c.dataset.c;
    if(c.checked){if(buf.ids.size>=n){c.checked=false;return;}buf.ids.add(id);}
    else{buf.ids.delete(id);if(buf.leader===id)buf.leader=null;}
    renderSelect();
  });
  document.querySelectorAll("input[data-l]").forEach(c=>c.onchange=()=>{
    buf.leader=+c.dataset.l;
    if(!buf.ids.has(buf.leader)&&buf.ids.size<n)buf.ids.add(buf.leader);
    renderSelect();
  });
  $("#go").onclick=()=>{
    if(buf.ids.size!==n||buf.leader==null||!buf.ids.has(buf.leader)){
      alert(buf.ids.size!==n?`Sélection incomplète : ${buf.ids.size}/${n}.`:"Désignez un leader parmi les sélectionnés.");
      return;
    }
    p.decided=true;
    p.entry={sel:[...buf.ids].map(i=>G.riders[i]),leader:G.riders[buf.leader],mode:buf.mode};
    G.selBuf=null;renderSelect();
  };
  const sk=$("#skip");if(sk)sk.onclick=()=>{p.decided=true;p.entry=null;G.selBuf=null;renderSelect();};
}

/* --- Résultats --- */
function renderResults(){
  let h=tabsHtml();
  h+=G.lastRes.map(res=>{
    const race=res.race;
    const meIn=res.entries.some(e=>e.ti===G.me);
    let x=`<div class="card"><h3>${race[0]} <span class="stat">· S${race[1]} · ${race[5]} j</span></h3>`;
    x+=`<div class="scroll"><table><thead><tr><th>#</th><th>Coureur</th><th>Équipe</th>${race[5]>1?"<th>Écart</th>":""}<th>Pts</th></tr></thead><tbody>`;
    const t0=res.times?res.times.get(res.rank[0]).time:0;
    res.rank.slice(0,10).forEach((r,i)=>{
      x+=`<tr ${r.t===G.me?'class="me"':''}><td class="stat">${i+1}</td><td><b>${U.esc(r.n)}</b></td>
      <td>${jer(r.t)}<span class="stat">${TEAMS[r.t][0]}</span></td>
      ${race[5]>1?`<td class="stat">${i===0?"—":U.tm(res.times.get(r).time-t0)}</td>`:""}
      <td class="n80">${PTS[race[4]][i]||""}</td></tr>`;
    });
    x+=`</tbody></table></div>`;
    if(meIn){
      const mine=res.rank.map((r,i)=>({r,i})).filter(o=>o.r.t===G.me);
      if(mine.length)x+=`<p class="stat" style="margin-top:6px">Vos coureurs : ${mine.slice(0,4).map(o=>U.esc(o.r.n)+" ("+(o.i+1)+"ᵉ)").join(" · ")}</p>`;
      const abandoned=res.entries.find(e=>e.ti===G.me).sel.filter(r=>res.times&&res.times.get(r)&&res.times.get(r).ab);
      if(abandoned.length)x+=`<p class="stat ko">Abandons : ${abandoned.map(r=>U.esc(r.n)).join(", ")}</p>`;
    }
    if(res.stages){
      const sw=new Map();
      res.stages.forEach(s=>sw.set(s.r,(sw.get(s.r)||0)+1));
      const top=[...sw.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6);
      x+=`<p class="stat" style="margin-top:6px">Étapes : ${top.map(([r,c])=>U.esc(r.n)+" ×"+c).join(" · ")}</p>`;
      if(res.events.length)x+=`<div style="margin-top:6px">${res.events.slice(0,6).map(e=>`<div class="evt">${e}</div>`).join("")}</div>`;
    }
    return x+"</div>";
  }).join("");
  h+=`<button class="btn" id="ok">Continuer ▸</button>`;
  app().innerHTML=h;bindTabs();
  $("#ok").onclick=()=>{G.tab="home";render();};
}

/* --- Mercato / bilan --- */
function renderMercato(){
  const me=G.teams[G.me],h=G.history[G.history.length-1];
  const rs=teamRiders(G.me).slice().sort((a,b)=>b.moy-a.moy);
  const pool=G.pool.filter(r=>r.t===-1).sort((a,b)=>b.moy-a.moy);
  const cap=me.budget*0.72;
  const cur=masse(G.me);
  app().innerHTML=`<div class="card"><h3>Bilan ${h.year}</h3>
  <div class="evt">Classement UCI : <b>${h.rank}ᵉ</b> · ${Math.round(h.pts)} pts · <b>${h.wins}</b> victoires · leader ${U.esc(h.best)}</div>
  <div class="evt">Budget ${h.year+1} : <b>${U.eur(me.budget)}</b> · plafond salarial conseillé ${U.eur(cap)}</div></div>
  <div class="grid2">
  <div class="card"><h3>Effectif (masse ${U.eur(cur)})</h3>
  ${rs.map(r=>`<div class="selrow"><span class="nm">${U.esc(r.n)}</span>
  <span class="${col(r.moy)}"><b>${r.moy}</b></span><span class="stat">${G.year-r.an} ans · ${U.eur(salary(r))}/an</span>
  ${r.retired?'<span class="tag warn">retraite</span>':`<button class="btn sec" data-rel="${r.id}" style="padding:4px 10px;font-size:.75rem">Libérer</button>`}
  </div>`).join("")}</div>
  <div class="card"><h3>Marché (libres + néo-pros)</h3>
  ${pool.map(r=>`<div class="selrow"><span class="nm">${U.esc(r.n)}${r.gen?' <span class="tag">néo-pro</span>':''}</span>
  <span class="stat">${r.nat} · ${G.year-r.an} ans</span>
  <span class="${col(r.moy)}"><b>${r.moy}</b></span><span class="stat">${U.eur(salary(r))}/an</span>
  <button class="btn sec" data-sign="${r.id}" style="padding:4px 10px;font-size:.75rem">Signer</button>
  </div>`).join("")||'<p class="stat">Marché épuisé.</p>'}</div>
  </div>
  <button class="btn" id="ns">Lancer la saison ${G.year+1} ▸</button>`;
  document.querySelectorAll("[data-rel]").forEach(b=>b.onclick=()=>{
    const r=G.riders[+b.dataset.rel];
    if(teamRiders(G.me).length<=8){alert("Effectif minimum atteint (8).");return;}
    r.t=-1;G.pool.push(r);renderMercato();
  });
  document.querySelectorAll("[data-sign]").forEach(b=>b.onclick=()=>{
    const r=G.riders[+b.dataset.sign];
    const max=TEAMS[G.me][2]===0?18:12;
    if(teamRiders(G.me).length>=max){alert("Effectif maximum atteint ("+max+").");return;}
    if(masse(G.me)+salary(r)>cap){alert("Plafond salarial dépassé.");return;}
    r.t=G.me;G.pool.splice(G.pool.indexOf(r),1);renderMercato();
  });
  $("#ns").onclick=newSeason;
}

/* ================= TESTS (harnais) ================= */
window.TestAPI={
  get G(){return G},init,advance:advanceSync,formOf,baseScore,simOneDay,simStageRace,
  invitedTeams,aiSelect,aiTactic,salary,masse,endSeason,newSeason,racesStarting,stageProfiles,
  autoSeason(){ // joue la saison entière, sélections auto pour le joueur
    let guard=0;
    while(G.week<=42&&guard++<400){
      const todo=racesStarting(G.week);
      const list=todo.map(race=>{
        if(!invitedTeams(race).includes(G.me))return {race,player:null};
        const n=race[2]==="gt"?8:7;
        const sel=aiSelect(G.me,race,n);
        if(sel.length<n)return {race,player:null};
        const t=aiTactic(sel,race);
        return {race,player:{sel,leader:t.leader,mode:t.mode}};
      });
      runWeekSync(list);
    }
  }
};
function runWeekSync(list){const t=G.tab;runWeek(list);G.tab=t;}
function advanceSync(){const todo=racesStarting(G.week);runWeekSync(todo.map(r=>({race:r,player:null})));}

/* ================= DÉMARRAGE ================= */
render();
</script>
