  <button class="btn sec sm" id="dauto">Répartition automatique</button>
  <button class="btn sm" id="dgo">Lancer la saison ▸</button></div>
  ${manque.length?`<p class="stat" style="color:var(--warn);margin-top:6px">Blocs légers : ${manque.join(" · ")}</p>`:""}</div>
  ${groupe("Grands tours",x=>x.rc[2]==="gt")}
  ${groupe("Monuments et Mondiaux",x=>x.rc[2]!=="gt"&&(x.rc[2]==="wc"||x.rc[4]>=4))}
  ${groupe("Classiques",x=>x.rc[2]==="cl"&&x.rc[4]===3)}
  ${groupe("Courses à étapes",x=>x.rc[2]==="ce")}
  <div class="card"><h3>Blocs de forme</h3>
  <p class="stat">Deux blocs maximum par coureur.</p>
  ${rs.map(r=>`<div style="padding:6px 0;border-bottom:1px solid var(--panel2)">
  <div style="display:flex;gap:8px;align-items:center;min-width:0">
  <span class="nm lnk" data-rp="${r.id}" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${U.esc(r.n)}</span>
  <span class="tag ${PROFTAG[r.prof]}">${PROFA[r.prof]}</span><b class="${col(r.moy)}">${r.moy}</b></div>
  <div class="pkchips">${PERIODS.map((p,i)=>`<span class="pkc ${r.p1===i||r.p2===i?"on":""}" data-r="${r.id}" data-p="${i}">${PCHIP[i]}</span>`).join("")}</div>
  </div>`).join("")}</div>`;

  document.querySelectorAll("[data-open]").forEach(row=>row.onclick=()=>{d.open=+row.dataset.open;renderDraft();});
  document.querySelectorAll(".pkc").forEach(c=>c.onclick=()=>{
    const r=rid(+c.dataset.r),p=+c.dataset.p;
    if(r.p1===p)r.p1=-1;
    else if(r.p2===p)r.p2=-1;
    else if(r.p1<0)r.p1=p;
    else if(r.p2<0)r.p2=p;
    else{notice("Deux blocs au maximum : décochez-en un d'abord.");return;}
    if(r.p1>=0&&r.p2>=0&&r.p1>r.p2){const t=r.p1;r.p1=r.p2;r.p2=t;}
    renderDraft();saveGame();
  });
  $("#dauto").onclick=()=>{autoProgram();notice("Blocs répartis sur la saison.");renderDraft();saveGame();};
  $("#dgo").onclick=()=>{
    const ko=rs.filter(r=>r.p1<0&&r.p2<0).length;
    if(ko){notice(ko+" coureur(s) sans bloc : utilisez la répartition automatique.");return;}
    G.phase="run";G.tab="home";render();saveGame();};
}
/* --- Marché des agents libres, ouvert toute la saison --- */
function freeAgents(){return G.riders.filter(r=>r.t===-1&&!r.retired).sort((a,b)=>b.moy-a.moy);}
function proRata(sal){return Math.round(sal*Math.max(0,43-G.week)/42);}
function signFree(id){
  const r=rid(id);if(!r||r.t!==-1)return;
  const cap=G.teams[G.me].budget*0.50,ask=askSalary(r),cout=proRata(ask);
  if(teamRiders(G.me).length>=maxSquad(G.me))return notice("Effectif au complet.");
  if(masse(G.me)+ask>cap)return notice("Plafond salarial dépassé de "+U.eur(masse(G.me)+ask-cap)+".");
  if(cout>G.teams[G.me].cash)return notice("Trésorerie insuffisante : "+U.eur(cout)+" nécessaires.");
  r.t=G.me;r.sal=ask;r.ctr=1;r.free=0;r.fat=0;r.out=0;r.weekLock=false;r.racedThisWeek=false;
  if(r.p1<0||r.p2<0)autoPeaks(r);
  G.teams[G.me].cash-=cout;
  notice(U.esc(r.n)+" signe jusqu'à la fin de la saison.");
  render();saveGame();
}
/* Les équipes IA piochent aussi sur le marché, au fil des semaines */
function freeAgentsAI(){
  const libres=freeAgents();
  if(!libres.length)return;
  G.teams.forEach(t=>{
    if(t.i===G.me||U.r()>0.05)return;
    if(teamRiders(t.i).length>=maxSquad(t.i))return;
    const cap=t.budget*0.50;
    // une équipe ne se renforce que sur un coureur qui améliore vraiment son effectif
    const faible=teamRiders(t.i).slice().sort((a,b)=>a.moy-b.moy)[0];
    const mini=faible?faible.moy+2:60;
    const i=libres.findIndex(r=>r.moy>=mini&&masse(t.i)+askSalary(r)<=cap);
    if(i<0)return;
    const r=libres[i],sal=askSalary(r);
    libres.splice(i,1);
    r.t=t.i;r.sal=sal;r.ctr=1;r.free=0;
    if(r.p1<0||r.p2<0)autoPeaks(r);
  });
}

/* --- Rôles : composants partagés --- */
const ROLLM=["L","EQ","SPR","EL"],ROLL1=["L","EQ","EL"];
const ROLN={L:"L",EQ:"ÉQ",SPR:"SPR",EL:"EL"};
const ORIS={L:["gc","echap","pois","vert"],EL:["gagne","echap","pois","vert"]};
const ORIS1={L:null,EL:["gagne","echap"]};
const ORIN={gc:"GC",gagne:"Gagne",echap:"Échap",pois:"Pois",vert:"Vert"};
function rolesHtml(sel,roles,oneday,dead){
  return sel.map(r=>{
    const st=roles[r.id]||(roles[r.id]={ro:"EQ",or:"gc"});
    const ab=dead&&dead.has(r.id);
    const list=oneday?ROLL1:ROLLM;
    const oris=ab?null:(oneday?ORIS1[st.ro]:ORIS[st.ro]);
    return `<div style="padding:5px 0;border-bottom:1px solid var(--panel2)${ab?";opacity:.35":""}">
    <div style="display:flex;gap:5px;align-items:center;min-width:0">
    <span class="lnk" data-rp="${r.id}" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem">${U.esc(r.n)}${ab?" ✕":""}</span>
    <span class="tag ${PROFTAG[r.prof]}" style="font-size:.58rem">${PROFA[r.prof]}</span>
    <b class="${col(r.moy)}" style="font-size:.72rem;flex:none">${r.moy}</b>
    ${ab?"":list.map(k=>`<span class="rchip ${st.ro===k?"on":""}" data-ro="${r.id}|${k}">${ROLN[k]}</span>`).join("")}
    </div>
    ${oris?`<div style="display:flex;gap:5px;margin-top:4px;padding-left:4px">${oris.map(o=>`<span class="ochip ${st.or===o?"on":""}" data-or="${r.id}|${o}">${ORIN[o]}</span>`).join("")}</div>`:""}
    </div>`;
  }).join("");
}
function bindRoles(roles,rerender){
  document.querySelectorAll("[data-ro]").forEach(c=>c.onclick=()=>{
    const [id,k]=c.dataset.ro.split("|");
    if(k==="L")Object.keys(roles).forEach(i2=>{if(roles[i2].ro==="L")roles[i2]={ro:"EQ",or:"gc"};});
    roles[+id]={ro:k,or:k==="EL"?"echap":"gc"};
    rerender();
  });
  document.querySelectorAll("[data-or]").forEach(c=>c.onclick=()=>{
    const [id,o]=c.dataset.or.split("|");
    roles[+id].or=o;
    rerender();
  });
}
function rolesValid(sel,roles,dead){
  return sel.filter(r=>!(dead&&dead.has(r.id))&&(roles[r.id]||{}).ro==="L").length===1;
}
function effElig(sel,roles,dead){
  return sel.filter(r=>!(dead&&dead.has(r.id))&&["L","SPR","EL"].includes((roles[r.id]||{}).ro));
}
function effDefault(elig,roles,sp){
  if(sp==="p"){const s=elig.find(r=>roles[r.id].ro==="SPR");if(s)return s.id;}
  const l=elig.find(r=>roles[r.id].ro==="L");
  return l?l.id:(elig.length?elig[0].id:null);
}
/* --- Sélection pré-course --- */
function renderSelect(){
  const p=G.pending.find(x=>!x.decided);
  if(p&&p.stage==="roles")return renderRolesPre(p);
  if(!p){
    const list=[];
    G.pending.forEach(x=>list.push({race:x.race,player:x.entry||null}));
    (G.otherRaces||[]).forEach(r=>list.push({race:r,player:null}));
    G.pending=[];G.otherRaces=[];
    showVeil();
    setTimeout(()=>{runWeek(list);hideVeil();},30);
    return;
  }
  const race=p.race,multi=race[5]>1;
  // indisponibles : alignés sur une course à étapes de la semaine ;
  // si la course actuelle est à étapes, alignés sur n'importe quelle autre course
  const already=new Set();
  G.pending.filter(x=>x.decided&&x.entry).forEach(x=>{
    if(multi||x.race[5]>1)x.entry.sel.forEach(r=>already.add(r.id));
  });
  const elig=r=>r.out===0&&!already.has(r.id)&&(!multi||!r.racedThisWeek);
  const pool=teamRiders(G.me);
  const eligN=pool.filter(elig).length;
  const n=Math.min(race[2]==="gt"?8:7,Math.max(4,eligN));
  const mand=race[2]==="gt"&&eligN>=4;
  const autoPick=wF=>{
    const sc=r=>baseScore(r,race[3])*Math.pow(formOf(r,race[1]),wF)*fatMult(r.fat);
    const hot=r=>inPeriod(r.p1,race[1])||inPeriod(r.p2,race[1]);
    const el=pool.filter(elig);
    const a=el.filter(hot).sort((x,y)=>sc(y)-sc(x));
    const b=el.filter(r=>!hot(r)).sort((x,y)=>sc(y)-sc(x));
    return a.concat(b).slice(0,n);
  };
  if(!G.selBuf||G.selBuf.race!==race){
    const sug=(p.sug||[]).filter(elig);
    const auto=sug.length>=Math.min(4,n)?sug.slice(0,n):autoPick(1);
    G.selBuf={race,ids:new Set(auto.map(r=>r.id)),sort:"adeq",sdir:1};
  }
  const buf=G.selBuf;
  [...buf.ids].forEach(id=>{if(!elig(rid(id)))buf.ids.delete(id)});
  const adq=r=>baseScore(r,race[3])*formOf(r,race[1])*fatMult(r.fat);
  const pkOf=r=>PC[inPeriod(r.p1,race[1])?r.p1:inPeriod(r.p2,race[1])?r.p2:nextPeak(r,race[1])];
  const sorters={
    nom:(a,b)=>a.n.localeCompare(b.n),
    adeq:(a,b)=>adq(b)-adq(a),
    forme:(a,b)=>formOf(b,race[1])-formOf(a,race[1]),
    spec:(a,b)=>a.prof.localeCompare(b.prof)||b.moy-a.moy,
    fatigue:(a,b)=>b.fat-a.fat,
    jours:(a,b)=>b.days-a.days,
    pic:(a,b)=>pkOf(a)-pkOf(b)};
  if(buf.sdir==null)buf.sdir=1;
  const rs=pool.slice().sort((a,b)=>buf.sdir*sorters[buf.sort](a,b));
  app().innerHTML=`<div class="card"><h3>Sélection : ${race[0]}</h3>
  <p class="stat">${race[5]} jour(s) · profil ${(SPNAME[race[3]]||"").toLowerCase()} · ${n} coureurs.${mand?' <b>Participation obligatoire (Grand Tour).</b>':''}</p>
  <div style="margin:8px 0;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
  <button class="btn sec sm" id="autoA">Auto adéquation</button>
  <button class="btn sec sm" id="autoF">Auto forme</button>
  <button class="btn sec sm" id="clr">Vider</button>
  <span class="pill">Sélection : <b>${buf.ids.size}</b>/${n}</span></div>
  <div><table class="seltab"><thead><tr><th>✓</th>${(()=>{const ar=k=>buf.sort===k?(buf.sdir>0?" ▼":" ▲"):"";const th=(k,l)=>`<th class="srt ${buf.sort===k?"on":""}" data-st="${k}">${l}${ar(k)}</th>`;return th("nom","Coureur")+th("spec","Spé")+th("adeq","ADQ")+th("forme","Forme")+th("fatigue","Fat")+th("jours","J")+th("pic","Pic");})()}</tr></thead><tbody>
  ${(()=>{return rs.map(r=>{
    const dis=!elig(r);
    const on=buf.ids.has(r.id);
    const ad=Math.round(adq(r));
    const nx=inPeriod(r.p1,race[1])?r.p1:inPeriod(r.p2,race[1])?r.p2:nextPeak(r,race[1]);
    const hot=inPeriod(r.p1,race[1])||inPeriod(r.p2,race[1]);
    return `<tr class="${on?"son":""} ${dis?"sdis":""}">
    <td><input type="checkbox" data-c="${r.id}" ${on?"checked":""} ${dis?"disabled":""}></td>
    <td class="selnm"><span class="lnk" data-rp="${r.id}">${U.esc(r.n)}</span></td>
    <td><span class="tag ${PROFTAG[r.prof]}">${PROFA[r.prof]}</span></td>
    <td><b class="${col(ad)}">${ad}</b></td>
    <td>${formPct(r,race[1])}</td>
    <td>${fatBar(r.fat)}</td>
    <td class="stat">${r.days}</td>
    <td><span class="pk ${hot?"hot":""}">${PSHORT[nx]}</span></td>
    </tr>`}).join("")})()}
  </tbody></table></div>
  <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">
  <button class="btn" id="go">Valider la sélection ▸</button>
  ${mand?"":'<button class="btn sec" id="skip">Faire l\'impasse</button>'}
  </div></div>`;
  document.querySelectorAll(".seltab th.srt").forEach(t=>t.onclick=()=>{
    const k=t.dataset.st;
    if(buf.sort===k)buf.sdir=-buf.sdir;
    else{buf.sort=k;buf.sdir=1;}
    renderSelect();
  });
  const setAuto=a=>{buf.ids=new Set(a.map(r=>r.id));renderSelect();};
  $("#autoA").onclick=()=>setAuto(autoPick(1));
  $("#autoF").onclick=()=>setAuto(autoPick(3));
  $("#clr").onclick=()=>{buf.ids.clear();renderSelect();};
  document.querySelectorAll("input[data-c]").forEach(c=>c.onchange=()=>{
    const id=+c.dataset.c;
    if(c.checked){
      if(buf.ids.size>=n){c.checked=false;notice("Sélection complète ("+n+" coureurs) : décochez-en un d'abord.");return;}
      buf.ids.add(id);}
    else{buf.ids.delete(id);}
    renderSelect();
  });
  $("#go").onclick=()=>{
    if(buf.ids.size!==n){notice(`Sélection incomplète : ${buf.ids.size}/${n}.`);return;}
    const sel=[...buf.ids].map(i=>rid(i));
    const ar=autoRoles(sel,race);
    p.entry={sel,roles:ar.roles,leader:ar.leader};
    p.stage="roles";
    renderSelect();
  };
  const sk=$("#skip");
  if(sk)sk.onclick=()=>{
    // renoncer à une course est sans retour : on demande confirmation
    if(!buf.skipOk){buf.skipOk=true;sk.textContent="Confirmer l'impasse";sk.classList.add("warn");
      notice("Vous ne prendrez pas le départ de "+race[0]+". Touchez à nouveau pour confirmer.");return;}
    p.decided=true;p.entry=null;G.selBuf=null;renderSelect();};
}

/* --- Course d'un jour jouable : rôles + Effort + lancement --- */
function renderOneDay(){
  stopMG();
  const od=G.oneDay,race=od.race;
  const myE=od.entries.find(e=>e.ti===G.me);
  if(!myE.roles)myE.roles=autoRoles(myE.sel,race).roles;
  const elig=effElig(myE.sel,myE.roles,null);
  if(od.effT==null||!elig.some(r=>r.id===od.effT))od.effT=effDefault(elig,myE.roles,race[3]);
  app().innerHTML=`<div class="card"><h3>${race[0]} <span class="stat">${SPICON[race[3]]} ${SPNAME[race[3]]}${race[4]>=4?" · Monument":""}</span></h3>
  <div>${rolesHtml(myE.sel,myE.roles,true,null)}</div></div>
  <div class="card"><h3>L'Effort</h3>
  <p class="stat">Figez l'aiguille au centre : bonus de forme du jour pour le coureur ciblé.</p>
  <div style="display:flex;gap:5px;flex-wrap:wrap;margin:6px 0">${elig.map(r=>`<span class="rchip ${od.effT===r.id?"on":""}" data-eff="${r.id}">${U.esc(r.n)} <span class="tag ${PROFTAG[r.prof]}" style="font-size:.55rem">${PROFA[r.prof]}</span> <b class="${col(r.moy)}">${r.moy}</b></span>`).join("")}</div>
  <canvas id="mgc" width="320" height="64" style="width:100%;max-width:360px;background:var(--panel2);border-radius:10px;touch-action:manipulation;margin-top:6px"></canvas>
  <div style="margin-top:8px;display:flex;gap:8px">
  <button class="btn" id="mgstop">Stop !</button>
  <button class="btn sec" id="mgpass">Passer</button>
  </div>
  <p id="mgres" class="stat" style="margin-top:6px"></p></div>
  <button class="btn" id="odgo" disabled>Lancer la course ▸</button>`;
  bindRoles(myE.roles,renderOneDay);
  document.querySelectorAll("[data-eff]").forEach(c=>c.onclick=()=>{od.effT=+c.dataset.eff;renderOneDay();});
  const done=()=>{$("#mgstop").disabled=true;$("#mgpass").disabled=true;$("#odgo").disabled=false;};
  const tgtE=od.effT!=null?rid(od.effT):null;
  const okCv=tgtE?startEffort(tgtE,race[3],false,0):false;
  if(!okCv){od.mgMult=1;$("#mgres").textContent="Mini-jeu indisponible ici.";done();}
  const stopFn=()=>{
    if(!MG)return;
    const j=judgeEffort();
    od.mgMult=j.mult;stopMG();
    $("#mgres").innerHTML="Résultat : <b class='"+j.cls+"'>"+j.label+"</b>";
    done();
  };
  $("#mgstop").onclick=stopFn;
  const cv=$("#mgc");if(cv)cv.onclick=stopFn;
  $("#mgpass").onclick=()=>{od.mgMult=1;stopMG();$("#mgres").textContent="Effort passé : aucun bonus.";done();};
  $("#odgo").onclick=()=>{
    if(!rolesValid(myE.sel,myE.roles,null)){notice("Désignez exactement un leader (L).");return;}
    stopMG();
    const tgt=od.effT!=null?rid(od.effT):null;
    showVeil();
    setTimeout(()=>{
      const res=simOneDay(race,od.entries,(tgt&&od.mgMult&&od.mgMult!==1)?{rider:tgt,mult:od.mgMult}:null);
      hideVeil();
      finishOneDay(res);
    },30);
  };
}
/* --- Mode étape par étape + mini-jeu L'Effort --- */
const SPNAME={p:"Plat",s:"Classique rapide",c:"Pavés",v:"Vallonné",m:"Montagne",t:"Chrono ind."};
const SPICON={p:"▬",s:"◈",c:"▤",v:"◠",m:"▲",t:"⏱"};
const RAF=cb=>window.requestAnimationFrame?window.requestAnimationFrame(cb):setTimeout(()=>cb((window.performance&&performance.now)?performance.now():Date.now()),16);
const CAF=id=>window.cancelAnimationFrame?window.cancelAnimationFrame(id):clearTimeout(id);
let MG=null;
function stopMG(){if(MG){CAF(MG.raf);MG=null;}}
function friseHtml(rs){
  return `<div class="frise">${rs.profs.map((p,i)=>`<span class="fs ${i<rs.si?"done":i===rs.si?"cur":""}">${SPICON[p]}</span>`).join("")}</div>`;
}
function simRest(){
  stopMG();
  const rs=G.live;
  rs.exp=null;
  showVeil();
  setTimeout(()=>{
    while(!rs.done)simStage(rs,null);
    hideVeil();
    finishLive();
  },30);
}
function renderLive(){
  stopMG();
  const rs=G.live;
  rs.mgMult=null;
  const sp=rs.profs[rs.si];
  const myE=rs.entries.find(e=>e.ti===G.me);
  if(!myE.roles)myE.roles=autoRoles(myE.sel,rs.race).roles;
  const dead=new Set(myE.sel.filter(r=>rs.st.get(r).ab).map(r=>r.id));
  const elig=effElig(myE.sel,myE.roles,dead);
  if(rs.effT==null||!elig.some(r=>r.id===rs.effT))rs.effT=effDefault(elig,myE.roles,sp);
  const gc=gcOf(rs),t0=gc.length?rs.st.get(gc[0]).time:0;
  const mine=gc.map((r,i)=>({r,i})).filter(o=>o.r.t===G.me&&o.i>=3).slice(0,3);
  app().innerHTML=`<div class="card"><h3>${rs.race[0]} · ét. ${rs.si+1}/${rs.profs.length} <span class="stat">${SPICON[sp]} ${SPNAME[sp]}${rs.si>=14?" · 3ᵉ sem.":""}</span></h3>
  ${friseHtml(rs)}
  ${rs.si>0&&gc.length?`<div style="margin-top:6px">
  ${gc.slice(0,3).map((r,i)=>`<div style="display:flex;gap:8px;align-items:center;font-size:.8rem;padding:2px 0"><span class="stat" style="width:14px">${i+1}</span><span class="lnk ${meCls(r)}" data-rp="${r.id}" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${U.esc(r.n)}</span><span class="stat">${i===0?"—":U.tm(rs.st.get(r).time-t0)}</span></div>`).join("")}
  ${mine.length?`<div style="padding-top:4px;border-top:1px solid var(--panel2)">
  ${mine.map(o=>`<div style="display:flex;gap:8px;align-items:center;padding:1px 0;font-size:.8rem"><span class="stat" style="width:30px">${o.i+1}ᵉ</span><span class="lnk ldr" data-rp="${o.r.id}" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${U.esc(o.r.n)}</span><span class="stat">${U.tm(rs.st.get(o.r).time-t0)}</span></div>`).join("")}</div>`:""}
  </div>`:""}
  <div style="margin:8px 0">
  <button class="btn sec sm" id="rlro">${rs.rolesOpen?"Fermer les rôles ▴":"Rôles ▾"}</button>
  ${rs.rolesOpen?`<div style="margin-top:6px">${rolesHtml(myE.sel,myE.roles,false,dead)}</div>`:""}
  </div></div>
  <div class="card"><h3>L'Effort</h3>
  <p class="stat">Figez l'aiguille au centre : bonus de forme du jour pour le coureur ciblé. Zone réduite par la fatigue, la montagne et la 3ᵉ semaine.</p>
  <div style="display:flex;gap:5px;flex-wrap:wrap;margin:6px 0">${elig.map(r=>`<span class="rchip ${rs.effT===r.id?"on":""}" data-eff="${r.id}">${U.esc(r.n)} <span class="tag ${PROFTAG[r.prof]}" style="font-size:.55rem">${PROFA[r.prof]}</span> <b class="${col(r.moy)}">${r.moy}</b></span>`).join("")||'<span class="stat">Aucun coureur éligible (L, SPR ou EL).</span>'}</div>
  <canvas id="mgc" width="320" height="64" style="width:100%;max-width:360px;background:var(--panel2);border-radius:10px;touch-action:manipulation;margin-top:6px"></canvas>
  <div style="margin-top:8px;display:flex;gap:8px">
  <button class="btn" id="mgstop">Stop !</button>
  <button class="btn sec" id="mgpass">Passer</button>
  </div>
  <p id="mgres" class="stat" style="margin-top:6px"></p></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
  <button class="btn" id="run" disabled>Lancer l'étape ▸</button>
  <button class="btn sec" id="rest">Simuler le reste ▸</button>
  </div>`;
  $("#rlro").onclick=()=>{rs.rolesOpen=!rs.rolesOpen;renderLive();};
  bindRoles(myE.roles,renderLive);
  document.querySelectorAll("[data-eff]").forEach(c=>c.onclick=()=>{rs.effT=+c.dataset.eff;renderLive();});
  const done=()=>{$("#mgstop").disabled=true;$("#mgpass").disabled=true;$("#run").disabled=false;};
  const tgtE=rs.effT!=null?rid(rs.effT):null;
  const okCv=tgtE?startEffort(tgtE,sp,rs.si>=14,rs.st.get(tgtE).f):false;
  if(!okCv){rs.mgMult=1;$("#mgres").textContent="Mini-jeu indisponible ici.";done();}
  const stopFn=()=>{
    if(!MG)return;
    const j=judgeEffort();
    rs.mgMult=j.mult;stopMG();
    $("#mgres").innerHTML="Résultat : <b class='"+j.cls+"'>"+j.label+"</b>";
    done();
  };
  $("#mgstop").onclick=stopFn;
  const cv=$("#mgc");if(cv)cv.onclick=stopFn;
  $("#mgpass").onclick=()=>{rs.mgMult=1;stopMG();$("#mgres").textContent="Effort passé : aucun bonus.";done();};
  $("#run").onclick=()=>{
    if(!rolesValid(myE.sel,myE.roles,dead)){rs.rolesOpen=true;notice("Votre leader a quitté la course : désignez un nouveau L.");renderLive();return;}
    stopMG();
    const tgt=rs.effT!=null?rid(rs.effT):null;
    simStage(rs,(tgt&&rs.mgMult&&rs.mgMult!==1)?{rider:tgt,mult:rs.mgMult}:null);
    rs.mgMult=null;
    renderStageResult();
  };
  $("#rest").onclick=simRest;
}
function startEffort(tgt,sp,wk3,extraFat){
  const cv=$("#mgc");
  const ctx=cv&&cv.getContext?cv.getContext("2d"):null;
  if(!ctx)return false;
  stopMG();
  const fat=U.cl((tgt?tgt.fat:0)+(extraFat||0),0,100);
  let ease=1-fat/260-(sp==="m"?0.13:0)-(wk3?0.08:0);
  ease=U.cl(ease,0.45,1);
  const speed=3.0+(wk3?1.0:0);
  MG={raf:0,t:U.r()*6,speed,ease,x:0.5,last:null};
  const wp=0.045*ease,wg=0.16*ease;
  const W=cv.width,H=cv.height;
  const draw=ts=>{
    const dt=MG.last==null?0.016:Math.min(0.05,Math.max(0.001,(ts-MG.last)/1000));
    MG.last=ts;
    MG.t+=dt*MG.speed;
    MG.x=0.5+0.47*Math.sin(MG.t);
    ctx.clearRect(0,0,W,H);
    const z=(c,a,b)=>{ctx.fillStyle=c;ctx.fillRect(W*a,14,W*(b-a),36);};
    z("#5a2320",0.03,0.97);z("#7a5a1e",0.20,0.80);
    z("#2e6b3f",0.5-wg,0.5+wg);z("#ffcc33",0.5-wp,0.5+wp);
    ctx.fillStyle="#fff";ctx.fillRect(W*MG.x-2,8,4,48);
    MG.raf=RAF(draw);
  };
  MG.raf=RAF(draw);
  return true;
}
function judgeEffort(){
  const d=Math.abs(MG.x-0.5);
  const wp=0.045*MG.ease,wg=0.16*MG.ease;
  if(d<=wp)return{mult:1.05,label:"Parfait ! Forme +5 %",cls:"n90"};
  if(d<=wg)return{mult:1.025,label:"Bon effort : forme +2,5 %",cls:"ok"};
  if(d<=0.30)return{mult:1.0,label:"Dans le rythme : neutre",cls:"stat"};
  return{mult:0.97,label:"À contretemps : forme −3 %",cls:"ko"};
}
/* Classements annexes génériques */
function standingsRows(rs,kind){
  const gc=gcOf(rs),t0=gc.length?rs.st.get(gc[0]).time:0;
  if(kind==="gc")return gc.map((r,i)=>({r,txt:i===0?"—":U.tm(rs.st.get(r).time-t0)}));
  if(kind==="young"){
    const y=gc.filter(r=>G.year-r.an<=25);
    return y.map((r,i)=>({r,txt:i===0?"—":U.tm(rs.st.get(r).time-rs.st.get(y[0]).time)}));
  }
  return gc.slice().sort((a,b)=>rs.st.get(b)[kind]-rs.st.get(a)[kind])
    .filter(r=>rs.st.get(r)[kind]>0).map(r=>({r,txt:rs.st.get(r)[kind]+" pts"}));
}
function standingsTable(rs,kind,limit){
  const rows=standingsRows(rs,kind).slice(0,limit||1000);
  return `<div class="scroll"><table><tbody>${rows.map((o,i)=>`<tr ${o.r.t===G.me?'class="me"':''}><td class="stat">${i+1}</td><td><span class="lnk ${meCls(o.r)}" data-rp="${o.r.id}">${U.esc(o.r.n)}</span> <span class="stat">${TEAMS[o.r.t][0]}</span></td><td class="stat">${o.txt}</td></tr>`).join("")}</tbody></table></div>`;
}

  const {rows,sp}=rs.lastStage;
  const exp=rs.exp||{};
  const view=exp.view||"gc";
  const J=jerseysOf(rs);
  const evts=rs.events.filter(e=>e.startsWith("Ét. "+rs.si+" "));
  const stRows=exp.stage?rows:rows.slice(0,10);
  app().innerHTML=`<div class="card"><h3>${rs.race[0]} · résultat ét. ${rs.si}/${rs.profs.length} <span class="stat">(${SPNAME[sp]})</span></h3>
  ${rows[0].brk?"<p class=\"stat\">L'échappée va au bout !"+((n=>n>1?" ("+n+" coureurs)":"")(rows.filter(x=>x.brk).length))+"</p>":""}
  ${exp.stage?'<button class="btn sec sm exps" style="margin-bottom:6px">Réduire</button>':""}
  <div class="scroll"><table><tbody>
  ${stRows.map((x,i)=>`<tr ${x.r.t===G.me?'class="me"':''}><td class="stat">${i+1}</td><td><b class="lnk ${meCls(x.r)}" data-rp="${x.r.id}">${U.esc(x.r.n)}</b></td><td class="lnk" data-tp="${x.r.t}">${jer(x.r.t)}<span class="stat">${TEAMS[x.r.t][0]}</span></td><td class="stat">${i===0?"—":(x.gap<1?"m.t.":U.tm(x.gap))}</td></tr>`).join("")}
  </tbody></table></div>
  <button class="btn sec sm exps">${exp.stage?"Réduire":"Tout afficher"}</button>
  ${evts.length?`<div style="margin-top:6px">${evts.map(e=>`<div class="evt">${e}</div>`).join("")}</div>`:""}
  </div>
  <div class="card"><h3>Classements</h3>
  <div class="jrow">
  <span class="pill jbtn ${view==="gc"?"jon":""}" data-v="gc" style="background:#e6c619;color:#111">${J.gc?U.esc(J.gc.n):"—"}</span>
  <span class="pill jbtn ${view==="pts"?"jon":""}" data-v="pts" style="background:#2e6b3f;color:#fff">${J.pts?U.esc(J.pts.n):"—"}</span>
  <span class="pill jbtn ${view==="kom"?"jon":""}" data-v="kom" style="background:#7a2530;color:#fff">${J.kom?U.esc(J.kom.n):"—"}</span>
  <span class="pill jbtn ${view==="young"?"jon":""}" data-v="young" style="background:#d9dee8;color:#111">${J.young?U.esc(J.young.n):"—"}</span></div>
  ${exp.full?'<button class="btn sec sm expg" style="margin-bottom:6px">Réduire</button>':""}
  ${standingsTable(rs,view,exp.full?1000:5)}
  <button class="btn sec sm expg">${exp.full?"Réduire":"Classement complet"}</button>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
  <button class="btn" id="nx">${rs.done?"Terminer la course ▸":"Étape suivante ▸"}</button>
  ${rs.done?"":'<button class="btn sec" id="rest">Simuler le reste ▸</button>'}
  </div>`;
  document.querySelectorAll(".jbtn").forEach(b=>b.onclick=()=>{rs.exp={...exp,view:b.dataset.v};renderStageResult();});
  document.querySelectorAll(".exps").forEach(b=>b.onclick=()=>{rs.exp={...exp,stage:!exp.stage};renderStageResult();});
  document.querySelectorAll(".expg").forEach(b=>b.onclick=()=>{rs.exp={...exp,full:!exp.full};renderStageResult();});
  $("#nx").onclick=()=>{rs.exp=null;if(rs.done)finishLive();else renderLive();};
  const rst=$("#rest");if(rst)rst.onclick=simRest;
}

/* --- Résultats --- */
function renderResults(){
  let h=tabsHtml();
  h+=G.lastRes.map((res,ri)=>{
    const race=res.race;
    const meIn=res.entries.some(e=>e.ti===G.me);
    const exp=(G.resExp&&G.resExp.i===ri)?G.resExp:null;
    let x=`<div class="card"><h3>${race[0]} <span class="stat">· S${race[1]} · ${race[5]} j</span></h3>`;
    if(res.brk)x+=`<p class="stat">Coup d'éclat : la victoire échappe aux favoris !</p>`;
    const lim=exp&&exp.full?1000:10;
    const t0=res.times?res.times.get(res.rank[0]).time:0;
    if(exp&&exp.full)x+=`<button class="btn sec sm" data-exf="${ri}" style="margin-bottom:6px">Réduire</button>`;
    const hasGap=race[5]>1||!!res.gaps;
    x+=`<div class="scroll"><table><thead><tr><th>#</th><th>Coureur</th><th>Équipe</th>${hasGap?"<th>Écart</th>":""}<th>Pts</th></tr></thead><tbody>`;
    res.rank.slice(0,lim).forEach((r,i)=>{
      x+=`<tr ${r.t===G.me?'class="me"':''}><td class="stat">${i+1}</td><td><b class="lnk ${meCls(r)}" data-rp="${r.id}">${U.esc(r.n)}</b></td>
      <td class="lnk" data-tp="${r.t}">${jer(r.t)}<span class="stat">${TEAMS[r.t][0]}</span></td>
      ${hasGap?`<td class="stat">${i===0?"—":race[5]>1?U.tm(res.times.get(r).time-t0):(res.gaps.get(r)<1?"m.t.":U.tm(res.gaps.get(r)))}</td>`:""}
      <td class="n80">${PTS[race[4]][i]||""}</td></tr>`;
    });
    x+=`</tbody></table></div>
    <button class="btn sec sm" data-exf="${ri}">${exp&&exp.full?"Réduire":"Classement complet"}</button>`;
    if(meIn){
      const mine=res.rank.map((r,i)=>({r,i})).filter(o=>o.r.t===G.me);
      const gtxt=o=>{
        if(o.i===0)return "—";
        if(race[5]>1)return U.tm(res.times.get(o.r).time-t0);
        if(res.gaps){const g=res.gaps.get(o.r);return g<1?"m.t.":U.tm(g);}
        return "";};
      if(mine.length)x+=`<div style="margin-top:8px;padding-top:6px;border-top:1px solid var(--panel2)"><span class="stat" style="color:var(--acc);font-weight:700">Vos coureurs</span>
      ${mine.map(o=>`<div style="display:flex;gap:8px;align-items:center;padding:2px 0;font-size:.82rem"><span class="stat" style="width:30px">${o.i+1}ᵉ</span><span class="lnk ldr" data-rp="${o.r.id}" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${U.esc(o.r.n)}</span><span class="stat">${gtxt(o)}</span></div>`).join("")}</div>`;
      const myE=res.entries.find(e=>e.ti===G.me);
      const ab=res.times?myE.sel.filter(r=>res.times.get(r)&&res.times.get(r).ab):[];
      if(ab.length){const byS=new Map();ab.forEach(r=>{const st=res.times.get(r).abSt||0;if(!byS.has(st))byS.set(st,[]);byS.get(st).push(r);});x+=`<div style="padding:2px 0">${[...byS.entries()].sort((a,b)=>a[0]-b[0]).map(([st,rs])=>`<div style="display:flex;gap:6px;font-size:.78rem"><span class="stat" style="width:36px;flex:none">${st?"Ét. "+st:"—"}</span><span class="ko">${rs.map(r=>U.esc(r.n)).join(" · ")}</span></div>`).join("")}</div>`;}
    }
    if(res.stages){
      const sw=new Map();
      res.stages.forEach(s=>sw.set(s.r,(sw.get(s.r)||0)+1));
      const multi=[...sw.entries()].filter(([r,c])=>c>1).sort((a,b)=>b[1]-a[1]);
      if(multi.length)x+=`<p class="stat" style="margin-top:6px">Multi-vainqueurs : ${multi.map(([r,c])=>`<span class="lnk ${meCls(r)}" data-rp="${r.id}"><b>${U.esc(r.n)}</b></span> ×${c}`).join(" · ")}</p>`;
      x+=`<div style="margin-top:6px">${res.stages.map(s=>`<div style="display:flex;gap:6px;align-items:center;padding:2px 0;font-size:.8rem;border-bottom:1px solid var(--panel2)"><span class="stat" style="width:36px;flex:none">Ét. ${s.st}</span><span class="lnk ${meCls(s.r)}" data-rp="${s.r.id}" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${U.esc(s.r.n)}</span><span class="stat" style="font-size:.68rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${TABR[s.r.t]} · ${s.r.nat}</span><span class="stat" style="flex:none">${SPNAME[s.prof]}${s.brk?" · éch.":""}</span></div>`).join("")}</div>`;
      if(res.rs){
        const J=jerseysOf(res.rs);
        const view=exp&&exp.view;
        x+=`<div class="jrow" style="margin-top:6px">
        <span class="pill jbtn ${view==="pts"?"jon":""}" data-exv="${ri}|pts" style="background:#2e6b3f;color:#fff">${J.pts?U.esc(J.pts.n):"—"}</span>
        <span class="pill jbtn ${view==="kom"?"jon":""}" data-exv="${ri}|kom" style="background:#7a2530;color:#fff">${J.kom?U.esc(J.kom.n):"—"}</span>
        <span class="pill jbtn ${view==="young"?"jon":""}" data-exv="${ri}|young" style="background:#d9dee8;color:#111">${J.young?U.esc(J.young.n):"—"}</span></div>`;
        if(view)x+=`${standingsTable(res.rs,view,20)}`;
      }
      const abAll=res.times?res.rank.concat(res.entries.flatMap(e=>e.sel)).filter((r,i,a)=>a.indexOf(r)===i&&res.times.get(r)&&res.times.get(r).ab):[];
      if(abAll.length){
        const bySt=new Map();
        abAll.forEach(r=>{const st=res.times.get(r).abSt||0;if(!bySt.has(st))bySt.set(st,[]);bySt.get(st).push(r);});
        x+=`<p class="stat" style="margin-top:6px;margin-bottom:2px">Abandons</p>${[...bySt.entries()].sort((a,b)=>a[0]-b[0]).map(([st,rs])=>`<div style="display:flex;gap:6px;align-items:baseline;padding:1px 0;font-size:.78rem"><span class="stat" style="width:36px;flex:none">${st?"Ét. "+st:"—"}</span><span style="min-width:0">${rs.map(r=>`<span class="lnk ${r.t===G.me?"ldr":"stat"}" data-rp="${r.id}">${U.esc(r.n)}</span>`).join(" · ")}</span></div>`).join("")}`;
      }
    }
    return x+"</div>";
  }).join("");
  h+=`<button class="btn" id="ok">Continuer ▸</button>`;
  app().innerHTML=h;bindTabs();
  document.querySelectorAll("[data-exf]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.exf;const cur=(G.resExp&&G.resExp.i===i)?G.resExp:{i};
    G.resExp={...cur,i,full:!cur.full};renderResults();});
  document.querySelectorAll("[data-exv]").forEach(b=>b.onclick=()=>{
    const [i,v]=b.dataset.exv.split("|");const cur=(G.resExp&&G.resExp.i===+i)?G.resExp:{i:+i};
    G.resExp={...cur,i:+i,view:cur.view===v?null:v};renderResults();});
  $("#ok").onclick=()=>{G.resExp=null;G.tab="home";render();};
}

/* --- Barre de spécialités (intersaison) --- */
function specBar(){
  const cnt={};teamRiders(G.me).forEach(r=>cnt[r.prof]=(cnt[r.prof]||0)+1);
  let plus=0;
  Object.keys(G.agreed||{}).forEach(id=>{const r=rid(+id);if(r&&r.t===-1){cnt[r.prof]=(cnt[r.prof]||0)+1;plus++;}});
  return `<div class="card" style="position:sticky;top:46px;z-index:5;padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
  ${["mon","pun","spr","fla","pla","chr"].map(p=>`<span class="tag ${PROFTAG[p]}">${PROFA[p]} ${cnt[p]||0}</span>`).join("")}
  <span class="pill">Effectif <b>${teamRiders(G.me).length+plus}</b>/${maxSquad(G.me)}</span></div>`;
}

  const me=G.teams[G.me],h=G.history[G.history.length-1];
  const cap=me.budget*0.50;
  const top5=teamRiders(G.me).slice().sort((a,b)=>b.pts-a.pts).slice(0,5);
  const gains=(G.progLog||[]).filter(x=>x.d>0).sort((a,b)=>b.d-a.d).slice(0,8);
  const losses=(G.progLog||[]).filter(x=>x.d<0).sort((a,b)=>a.d-b.d).slice(0,5);
  const pline=x=>{const r=rid(x.id);return `<div style="display:flex;gap:8px;align-items:center;padding:2px 0;font-size:.82rem"><span class="lnk" data-rp="${r.id}" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${U.esc(r.n)}</span><span class="stat">${G.year-r.an}a</span><b class="${x.d>0?"ok":"ko"}">${x.d>0?"+":""}${x.d} MOY</b></div>`};

/* --- Négociation type manager --- */
function uciRankOf(ti){return G.teams.slice().sort((a,b)=>b.pts-a.pts).findIndex(t=>t.i===ti)+1;}
function negoAnswer(r,off){
  G.nego=G.nego||{};
  const st=G.nego[r.id]=G.nego[r.id]||{tries:0,broken:false};
  if(st.broken)return st;
  const ask=askSalary(r);
  const rk=uciRankOf(G.me);
  // prestige : une star exige une équipe du haut de tableau, sinon prime importante
  let prem=1+(rk<=5?-0.03:rk<=8?0.02:rk<=14?0.08:0.15);
  if(r.moy>=85&&rk>8)prem+=0.12;
  if(r.moy>=82&&rk>14)prem+=0.08;
  if(st.res==null)st.res=1+U.r()*0.10+(r.moy>=85?0.05:0); // exigence cachée du coureur
  const want=ask*prem*st.res;
  // entre deux relances, un gros profil peut s'engager ailleurs
  if(st.tries>=1&&r.moy>=78&&U.r()<0.10+(r.moy-78)*0.012){
    st.broken=true;
    st.msg="« Trop tard : je viens de m'engager avec une autre équipe. »";
    return st;
  }
  const age=G.year-r.an;
  const durPref=age<=25?3:age>=33?1:2;
  const better=teamRiders(G.me).filter(x=>x.moy>r.moy).length;
  const expRole=better<3?"L":better<10?"LT":"EQ";
  const ord={L:3,LT:2,EQ:1};
  const roleFit=ord[off.role]>=ord[expRole]?0.05:-(ord[expRole]-ord[off.role])*0.10;
  const durFit=-Math.abs(off.dur-durPref)*0.035;
  const score=off.sal/want+roleFit+durFit;
  st.tries++;
  // offre insultante : rupture possible immédiate
  if(st.tries===1&&off.sal<want*0.85&&U.r()<0.5){
    st.broken=true;
    st.msg="« C'est une offre insultante. Cette discussion s'arrête là. »";
    return st;
  }
  if(score>=1.0){
    st.agreed={sal:off.sal,dur:off.dur,role:off.role};
    st.msg="« Marché conclu, on écrit une belle histoire ensemble. »";
    G.agreed=G.agreed||{};G.agreed[r.id]=st.agreed;
  } else if(st.tries>=3&&score<0.92){
    st.broken=true;
    st.msg="« On tourne en rond, je vais voir ailleurs. » Négociation rompue.";
  } else {
    const cSal=Math.round(want*(1.02+U.r()*0.05)/1000)*1000;
    const parts=[];
    if(off.sal<want*0.98)parts.push("mon agent attend "+U.eur(cSal));
    if(roleFit<0)parts.push("je vise un rôle de "+(expRole==="L"?"leader":"lieutenant"));
    if(Math.abs(off.dur-durPref)>=1)parts.push(durPref+" an(s) me conviendrait mieux");
    st.msg="« Pas à ces conditions : "+(parts.join(", ")||"faites un effort")+". »";
    st.counter={sal:cSal,dur:durPref,role:expRole};
  }
  return st;
}

  <span class="tag ${PROFTAG[x.r.prof]}">${PROFA[x.r.prof]}</span><b class="${col(x.r.moy)}">${x.r.moy}</b>
  <span class="stat">${U.eur(x.a.sal)}·${x.a.dur}an</span>
  <button class="btn sec sm" data-pvx="${x.r.id}" style="color:var(--warn)">Annuler</button></div>`).join("")}</div>`:""}
  <div class="card"><h3>Sous contrat (${squad.length})</h3>
  ${squad.map(r=>`<div class="selrow one"><span class="nm lnk" data-rp="${r.id}">${U.esc(r.n)}${r.gen&&r.ctr===3?' <span class="tag">N</span>':""}</span>
  <span class="tag ${PROFTAG[r.prof]}">${PROFA[r.prof]}</span><b class="${col(r.moy)}">${r.moy}</b>
  <span class="stat">${U.eur(r.sal||salary(r))}</span>
  <button class="btn sec sm" data-pvr="${r.id}" style="color:var(--warn)">Libérer</button></div>`).join("")}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
  <button class="btn sec" id="pvback">◂ Mercato</button>
  <button class="btn" id="pvok">Valider et clôturer ▸</button></div>`;
  document.querySelectorAll("[data-pvx]").forEach(b=>b.onclick=()=>{
    delete G.agreed[+b.dataset.pvx];renderPreval();saveGame();});
  document.querySelectorAll("[data-pvr]").forEach(b=>b.onclick=()=>{
    const r=rid(+b.dataset.pvr);
    r.t=-1;r.ctr=0;r.role=undefined;if(!G.pool.includes(r))G.pool.push(r);
    G.renew=(G.renew||[]).filter(id=>id!==r.id);
    renderPreval();saveGame();});
  $("#pvback").onclick=()=>{G.phase="mercato";G.msub="market";render();};
  $("#pvok").onclick=()=>{
    if(!okAll){
      notice(over>0?"Masse au-dessus du plafond : libérez ou annulez ("+U.eur(over)+").":nProj<8?"Effectif minimum : 8 coureurs.":"Effectif maximum dépassé.");
      return;
    }
    resolveMarket();G.phase="mercato";render();saveGame();
  };
}
/* ================= TESTS (harnais) ================= */
window.TestAPI={
  get G(){return G},init,advance:advanceSync,formOf,baseScore,simOneDay,simStageRace,rid,reindex,
  invitedTeams,aiSelect,aiTactic,salary,masse,endSeason,newSeason,racesStarting,stageProfiles,
  initStageRace,simStage,finishStageRace,gcOf,jerseysOf,
  askSalary,resolveMarket,aiFill,teamPeaks,standingsRows,
  aiPlanWeek,buildRoles,negoAnswer,saveGame,loadGame,hasSave,wipeSave,autoRoles,buildCtxRoles,rolesValid,
  autoSeason(){ // joue la saison entière, sélections auto pour le joueur
    let guard=0;
    while(G.week<=42&&guard++<400){
      const todo=racesStarting(G.week);
      const list=todo.map(race=>{
        if(!invitedTeams(race).includes(G.me))return {race,player:null};
        const n=race[2]==="gt"?8:7;
        const sel=aiSelect(G.me,race,n);
        if(sel.length<n)return {race,player:null};
        const t=autoRoles(sel,race);
        return {race,player:{sel,leader:t.leader,roles:t.roles}};
      });
      runWeekSync(list);
    }
  }
};
function runWeekSync(list){const t=G.tab;runWeek(list);G.tab=t;}
function advanceSync(){const todo=racesStarting(G.week);runWeekSync(todo.map(r=>({race:r,player:null})));}

/* ================= DÉMARRAGE ================= */
render();
</script>
